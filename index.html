function kadPasang(){
  var ua=navigator.userAgent||"";
  var sendiri=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  if(sendiri) return null;
  var tanda=null; try{ tanda=localStorage.getItem("cn-pasang"); }catch(e){}
  if(tanda==="dipasang") return null;
  if(tanda&&Date.now()-Number(tanda)<14*864e5) return null;
  var dalamApp=/FBAN|FBAV|Instagram|Line\/|TikTok|musical_ly|Snapchat/i.test(ua);
  var ios=/iPhone|iPad|iPod/.test(ua)&&!dalamApp&&!/CriOS|FxiOS|EdgiOS/.test(ua);
  var android=/Android/.test(ua)&&!dalamApp;
  if(!GESA_PASANG&&!ios&&!android) return null;

  var k=el("div","kotakmain pasang");
  k.appendChild(el("span","em","\u{1F4F2}"));
  var d=GESA_PASANG
    ? "Sekali tekan, terus main. Tak payah cari pautan dalam group lagi."
    : ios
    ? '<ol class="langkah"><li>Tekan butang <b>Kongsi</b> (petak dengan anak panah ke atas) di bawah skrin.</li>'+
      '<li>Pilih <b>Add to Home Screen</b>.</li></ol>'
    : '<ol class="langkah"><li>Tekan <b>&#8942;</b> di penjuru atas kanan Chrome.</li>'+
      '<li>Pilih <b>Tambah ke skrin utama</b> (Add to Home screen).</li></ol>';
  k.appendChild(el("div","txt",'<div class="t">Letak Jejak TP di skrin telefon</div><div class="d">'+d+'</div>'));
  if(GESA_PASANG){
    var b=el("button","btn sm"); b.type="button"; b.textContent="Letak";
    b.onclick=function(){
      var g=GESA_PASANG; GESA_PASANG=null;
      g.prompt();
      (g.userChoice||Promise.resolve({})).then(function(r){
        if(r&&r.outcome==="accepted"){ try{ localStorage.setItem("cn-pasang","dipasang"); }catch(e){} }
        render();
      });
    };
    k.appendChild(b);
  }
  var t=el("button","tutup"); t.type="button"; t.textContent="Nanti";
  t.onclick=function(){ try{ localStorage.setItem("cn-pasang",String(Date.now())); }catch(e){} k.remove(); };
  k.appendChild(t);
  return k;
}

function masukMurid(no){
  S.no=no; S.latihan=false;
  S.lulus=kiraLulus();
  var t=tpDicapai(S.lulus);
  S.aras=(t>0&&t<6)?t+1:(t===6?6:1);
  simpanDiri();
  S.skrin="peta"; render();
}
function kiraLulus(){
  var L={};
  if(!S.no) return L;
  for(var i=1;i<=6;i++){
    var c=cubaanMurid(S.kelasId,S.no,i);
    if(c&&c.terbaik&&c.terbaik.lulus) L[i]=true;
  }
  var g=guruUntuk(S.kelasId,S.no);
  if(g&&Number(g.tp)>=6) L[6]=true;
  kiraKad();
  return L;
}
/* Kad milik murid, bukan milik peranti. Murid yang bertukar telefon atau
   membersihkan pelayar patut mendapat semula kad yang rekodnya sudah
   membuktikan, jadi ia dibina semula daripada rekod dan bukan hanya
   daripada permainan pada peranti ini. */
function kiraKad(){
  if(!S.no) return;
  for(var i=1;i<=6;i++){
    var c=cubaanMurid(S.kelasId,S.no,i);
    if(!c||!c.terbaik) continue;
    if(c.terbaik.lulus) S.kad[i+"a"]=1;
    if(c.terbaik.bos) S.kad[i+"b"]=1;
    if(i===6&&c.karangan&&c.karangan.teks){ S.kad["6a"]=1; S.kad["6b"]=1; }
  }
  var g=guruUntuk(S.kelasId,S.no);
  if(g&&Number(g.tp)>=6){ S.kad["6a"]=1; S.kad["6b"]=1; }
}

/* Kedudukan mendatar setiap hentian (peratus lebar), supaya laluan berliku
   seperti peta level dan setiap nod ada ruang untuk labelnya. */
var POS_NOD=[28,64,78,40,22,60];
var TINGGI_NOD=118;

function lukisLaluan(n,lulus){
  var pts=[];
  for(var k=0;k<n;k++) pts.push([POS_NOD[k%POS_NOD.length], TINGGI_NOD*k+TINGGI_NOD/2]);
  function seg(a,b){ var my=(a[1]+b[1])/2; return "M"+a[0]+" "+a[1]+" C"+a[0]+" "+my+" "+b[0]+" "+my+" "+b[0]+" "+b[1]; }
  var tebal="", isi="";
  for(k=1;k<n;k++){
    var d=seg(pts[k-1],pts[k]), siap=!!lulus[k];
    tebal+='<path d="'+d+'" stroke="var(--garis)" stroke-width="20" vector-effect="non-scaling-stroke"/>';
    isi+='<path d="'+d+'" stroke="'+(siap?"var(--lulus)":"var(--kad2)")+'" stroke-width="13" vector-effect="non-scaling-stroke"/>';
    if(!siap) isi+='<path d="'+d+'" stroke="var(--lembut)" stroke-width="4" stroke-dasharray="0.1 13" opacity=".7" vector-effect="non-scaling-stroke"/>';
  }
  return '<svg class="jalan" viewBox="0 0 100 '+(n*TINGGI_NOD)+'" preserveAspectRatio="none" aria-hidden="true">'+tebal+isi+'</svg>';
}

  if(babs.length>1){

/* ---------- papan skor, dikongsi oleh murid dan guru ---------- */
function barisPapan(kelas,mingguan){
  return nomborKelas(kelas).map(function(m){
    var no=m.no;
    if(mingguan){ var w=mingguMurid(kelas,no); return {no:no,utama:w.lulus,skor:w.skor}; }
    var lulus=0;
    for(var i=1;i<=6;i++){ var c=cubaanMurid(kelas,no,i); if(c&&c.terbaik&&c.terbaik.lulus) lulus++; }
    return {no:no,utama:lulus,skor:skorMurid(kelas,no)};
  }).filter(function(x){ return x.utama>0||x.skor>0; })
    .sort(function(a,b){ return mingguan ? ((b.utama-a.utama)||(b.skor-a.skor)) : ((b.skor-a.skor)||(b.utama-a.utama)); });
}
function tabPapan(nilai,tukar){
  var tabP=el("div","papantab");
  [["minggu","Minggu ini"],["semua","Sepanjang bab"]].forEach(function(x){
    var b=el("button"); b.type="button"; b.textContent=x[1];
    b.setAttribute("aria-pressed", nilai===x[0] ? "true":"false");
    b.onclick=function(){ tukar(x[0]); };
    tabP.appendChild(b);
  });
  return tabP;
}
/* Kedudukan dikira ikut susunan penuh, jadi baris "awak" yang ditambah di
   hujung masih menunjukkan nombor kedudukan sebenar. */
function lukisPapan(kelas,baris,mingguan,saya,sorok,semua){
  var pap=el("div","papan");
  var PINGAT=["\u{1F947}","\u{1F948}","\u{1F949}"];
  baris.forEach(function(m){
    var rk=(semua||baris).indexOf(m);
    var r=el("div","prow"+((saya&&m.no===saya)?" saya":""));
    var label=sorok?("Murid "+(rk+1)):namaPendek(kelas,m.no);
    var kanan=mingguan ? (m.utama+" hentian") : (m.skor+" mata");
    var sub=mingguan ? (m.skor+" mata minggu ini") : (m.utama+" / 6 hentian dilepasi");
    r.innerHTML='<span class="rk">'+(rk<3?'<span class="pingat">'+PINGAT[rk]+'</span>':(rk+1))+'</span>'+
      '<span>'+esc(label)+((saya&&m.no===saya)?" (awak)":"")+
      '<br><span class="sub">'+esc(sub)+'</span></span>'+
      '<span class="sk">'+kanan+'</span>';
    pap.appendChild(r);
  });
  return pap;
}

/* Balut setiap jadual yang boleh dileret dengan petunjuk, kemudian semak
   selepas susun atur siap sama ada ia benar-benar melimpah. */
function tandaLeret(bekas){
  [].slice.call(bekas.querySelectorAll(".scrollx")).forEach(function(x){
    var bungkus=el("div","leret-bungkus");
    x.parentNode.insertBefore(bungkus,x); bungkus.appendChild(x);
    var nota=el("p","leret-nota","Leret jadual ke kiri untuk melihat semua lajur.");
    bungkus.parentNode.insertBefore(nota,bungkus.nextSibling);
    function kemas(){
      var limpah=x.scrollWidth>x.clientWidth+10;   /* limpahan kecil hanyalah ruang pelapik */
      bungkus.classList.toggle("leret",limpah);
      bungkus.classList.toggle("hujung",limpah&&x.scrollLeft+x.clientWidth>=x.scrollWidth-2);
    }
    x.addEventListener("scroll",kemas,{passive:true});
    requestAnimationFrame(kemas);
  });
}

/* Semakan sendiri dengan AI dahulunya disediakan oleh pelayan artifact.
   Halaman ini kini berdiri sendiri, jadi ciri itu ditanggalkan. Tugasan
   reka cipta dibaca oleh cikgu, dan itu memang cara yang lebih betul. */

/* ============================================================
   SIMPANAN
   Tempatan dahulu, pelayan kemudian. Setiap tulisan yang gagal sampai
   ke pelayan masuk ke peti keluar dan dicuba semula, supaya bukti PBD
   tidak hilang hanya kerana wifi sekolah tersekat seketika.

   Tiada satu pun jadual boleh ditulis terus dari sini. Semua tulisan
   melalui fungsi pangkalan data yang menyemak kod dahulu, jadi kod
   murid dan kod cikgu ialah sempadan sebenar, bukan sekadar skrin.
   ============================================================ */
var AWAN = (window.CN_AWAN && window.CN_AWAN.url && window.CN_AWAN.kunci) ? window.CN_AWAN : null;
var TALIAN = { ada:!!AWAN, sihat:!!AWAN, tertunggak:0 };

function rpc(nama,badan){
  if(!AWAN) return Promise.reject(new Error("luar talian"));
  return fetch(AWAN.url+"/rest/v1/rpc/"+nama,{
    method:"POST",
    headers:{"apikey":AWAN.kunci,"Authorization":"Bearer "+AWAN.kunci,"Content-Type":"application/json"},
    body:JSON.stringify(badan||{})
  }).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){
      if(!r.ok){ var e=new Error((j&&j.message)||("HTTP "+r.status)); e.badan=j; throw e; }
      TALIAN.sihat=true; return j;
    });
  }).catch(function(e){ if(!e.badan) TALIAN.sihat=false; throw e; });
}
/* ---------- ping tanpa nama ----------
   Pautan main bebas (?main) tidak menyimpan apa-apa rekod, jadi tanpa ini
   tiada sesiapa tahu sama ada ia digunakan atau sama ada ada pepijat yang
   menghalang murid daripada bermain. Yang dihantar hanyalah: jenis kejadian,
   id bab, nombor hentian, dan 8 aksara rawak yang membezakan satu telefon
   daripada telefon lain. Tiada nama, tiada sekolah, tiada jawapan. Ping yang
   gagal dibiarkan gagal: ia tidak boleh mengganggu permainan. */
var PERANTI=(function(){
  try{
    var v=localStorage.getItem("cn-peranti");
    if(!v||!/^[a-z0-9]{8}$/.test(v)){
      v=Math.random().toString(36).slice(2,10).replace(/[^a-z0-9]/g,"0");
      while(v.length<8) v+="0";
      localStorage.setItem("cn-peranti",v);
    }
    return v;
  }catch(e){ return null; }
})();
var ralatDihantar={};
function ping(jenis,bab,aras,nota){
  if(!AWAN||!PERANTI) return;
  try{
    fetch(AWAN.url+"/rest/v1/rpc/jm_ping",{
      method:"POST", keepalive:true,
      headers:{"apikey":AWAN.kunci,"Authorization":"Bearer "+AWAN.kunci,"Content-Type":"application/json"},
      body:JSON.stringify({p_jenis:jenis, p_peranti:PERANTI, p_bab:bab||null,
                           p_aras:(aras||null), p_nota:String(nota||"").slice(0,300)})
    }).catch(function(){});
  }catch(e){}
}
function pingRalat(mesej){
  var m=String(mesej||"").slice(0,300);
  if(!m||ralatDihantar[m]) return;
  ralatDihantar[m]=1;
  ping("ralat",(typeof BAB_ID==="string"?BAB_ID:null),null,m);
}
window.addEventListener("error",function(e){
  pingRalat((e.message||"ralat")+" @ "+(e.filename||"?").split("/").pop()+":"+(e.lineno||0));
});
window.addEventListener("unhandledrejection",function(e){
  var r=e.reason; pingRalat("janji: "+((r&&r.message)||r));
});

function bacaJadual(jadual,soal){
  if(!AWAN) return Promise.reject(new Error("luar talian"));
  return fetch(AWAN.url+"/rest/v1/"+jadual+"?"+soal,{
    headers:{"apikey":AWAN.kunci,"Authorization":"Bearer "+AWAN.kunci}
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    TALIAN.sihat=true; return r.json();
  }).catch(function(e){ TALIAN.sihat=false; throw e; });
}

/* ---------- peti keluar ---------- */
function petiBaca(){ try{ return JSON.parse(localStorage.getItem("cn-peti")||"[]"); }catch(e){ return []; } }
function petiTulis(p){ try{ localStorage.setItem("cn-peti",JSON.stringify(p.slice(-60))); }catch(e){} TALIAN.tertunggak=p.length; lukisTalian(); }
function petiTambah(surat){ var p=petiBaca(); p.push(surat); petiTulis(p); }
/* Hanya satu penghantaran peti berjalan pada satu masa. Tanpa kunci ini,
   dua cubaan serentak boleh menghantar surat yang sama dua kali dan
   menambah kiraan percubaan murid secara palsu. */
var PETI_SIBUK=false;
function petiHantar(){
  if(!AWAN||PETI_SIBUK) return Promise.resolve();
  var p=petiBaca(); if(!p.length) return Promise.resolve();
  PETI_SIBUK=true;
  var baki=[];
  return p.reduce(function(rantai,surat){
    return rantai.then(function(){
      return rpc(surat.f,surat.b).then(function(hasil){
        if(surat.f==="jm_simpan_cubaan"&&hasil) terimaBarisCubaan(hasil);
      }).catch(function(e){
        /* ralat kod atau data tidak akan berjaya walau dicuba seribu kali,
           jadi ia dibuang. Hanya kegagalan rangkaian yang disimpan semula. */
        if(!e.badan) baki.push(surat);
      });
    });
  },Promise.resolve()).then(function(){
    petiTulis(baki); PETI_SIBUK=false;
    if(!baki.length) segar();
  },function(){ PETI_SIBUK=false; });
}

/* Peti keluar pulih sendiri semasa sesi, bukan hanya apabila halaman dibuka
   semula: apabila pelayar kembali dalam talian, selepas mana-mana tulisan

/* ---------- cubaan ---------- */
function rekodCubaan(a,lulus){
  if(!S.no||S.modHarian||S.latihan) return;
  var senaraiS=S.set.filter(function(q){ return !q._ulang; })
    .map(function(q){ return {qid:q.id, betul:(q._betul===true)}; });
  var kini={
    masa:Date.now(), betul:S.betulBiasa, jumlah:S.jumlahBiasa,
    bos:S.bosBetul, lulus:!!lulus, skor:S.skor,
    mod:S.tenang?"tenang":"masa", soalan:senaraiS
  };
  var karangan=(a===6&&S.bosHantar&&S.karangan)?{teks:String(S.karangan).slice(0,4000),masa:Date.now()}:null;
  simpanCubaan(S.kelasId,S.no,a,kini,karangan);
  S.karangan=null;
}
function gabungCubaan(lama,kelas,no,a,kini,karangan){
  var out = (lama&&lama.v===SKEMA)
    ? {v:SKEMA,kelas:kelas,no:no,aras:a,pertama:lama.pertama||null,terbaik:lama.terbaik||null,
       kali:lama.kali||0,karangan:lama.karangan||null}
    : {v:SKEMA,kelas:kelas,no:no,aras:a,pertama:null,terbaik:null,kali:0,karangan:null};
  if(kini){
    if(!out.pertama) out.pertama=kini;
    if(!out.terbaik||kini.betul>out.terbaik.betul||(kini.lulus&&!out.terbaik.lulus)) out.terbaik=kini;
    out.kali=out.kali+1;
    out.akhir=kini.masa;
  }
  if(karangan) out.karangan=karangan;
  return out;
}
function terimaBarisCubaan(baris){
  if(baris&&baris.ralat==="pin"){ pinBerubah(); return; }
  if(!baris||!baris.kelas) return;
  if(baris.bab&&baris.bab!==BAB_ID) return;   /* bab lain, bukan urusan skrin ini */
  var c={v:SKEMA,kelas:baris.kelas,no:baris.no,aras:baris.aras,
         pertama:baris.pertama,terbaik:baris.terbaik,kali:baris.kali,
         karangan:baris.karangan,akhir:baris.akhir};
  CUBAAN[kunciC(c.kelas,c.no,c.aras)]=c;
  simpanSalinan(c);
}
function simpanSalinan(c){
  try{ localStorage.setItem("cn-cubaan-"+BAB_ID+"-"+c.kelas+"-"+c.no+"-a"+c.aras,JSON.stringify(c)); }catch(e){}
}
function simpanCubaan(kelas,no,a,kini,karangan){
  var kunci=kunciC(kelas,no,a);
  var badan=gabungCubaan(CUBAAN[kunci],kelas,no,a,kini,karangan);
  CUBAAN[kunci]=badan;
  simpanSalinan(badan);
  if(!AWAN) return;
  var surat={f:"jm_simpan_cubaan",b:{p_bab:BAB_ID,p_kelas:kelas,p_no:no,p_kod:S.kod||"",
             p_aras:a,p_kini:kini,p_karangan:karangan}};
  rpc(surat.f,surat.b)
    .then(function(hasil){ terimaBarisCubaan(hasil); segar(); petiHantar(); })
    .catch(function(e){ if(!e.badan){ petiTambah(surat); } lukisTalian(); });
}
function paduCubaan(x,y){
  if(!x) return y; if(!y) return x;
  var out={v:SKEMA,kelas:x.kelas||y.kelas,no:x.no||y.no,aras:x.aras||y.aras};
  var px=x.pertama, py=y.pertama;
  out.pertama=(px&&py)?(px.masa<=py.masa?px:py):(px||py);
  var tx=x.terbaik, ty=y.terbaik;
  out.terbaik=(tx&&ty)?(((ty.betul>tx.betul)||(ty.lulus&&!tx.lulus))?ty:tx):(tx||ty);
  out.kali=Math.max(x.kali||0,y.kali||0);
  out.akhir=Math.max(x.akhir||0,y.akhir||0);
  var kx=x.karangan, ky=y.karangan;
  out.karangan=(kx&&ky)?((ky.masa>kx.masa)?ky:kx):(kx||ky);
  if(x.contoh||y.contoh) out.contoh=true;
  return out;
}
function letakCubaan(c){
  if(!c||!c.kelas||!c.no||!c.aras) return;
  if(c.v===undefined) c.v=SKEMA;
  if(c.v!==SKEMA) return;
  var k=kunciC(c.kelas,c.no,c.aras);
  CUBAAN[k]=paduCubaan(CUBAAN[k],c);
}

function muatTempatan(){

        NOMBOR[KM.id]=(x.murid||[]).map(function(m){ return {no:m.no}; });
        NAMA[KM.id]={};
        (x.murid||[]).forEach(function(m){ NAMA[KM.id][m.no]=m.nama; });
      }

  var j=$("talianJalur");

    if(AWAN&&TALIAN.tertunggak>0){
      j.hidden=false; j.className="talian-jalur";
      j.textContent=(TALIAN.tertunggak===1?"1 jawapan":TALIAN.tertunggak+" jawapan")+
        " belum sampai kepada cikgu. Ia disimpan pada telefon ini dan akan dihantar sendiri apabila talian pulih. Teruskan bermain.";

      j.hidden=false; j.className="talian-jalur luar";
      j.textContent="Telefon ini tidak dapat menghubungi pelayan. Jawapan akan disimpan dan dihantar apabila talian pulih.";

  if(!AWAN){ e.className="talian luar"; e.textContent="Tanpa pelayan"; e.title="Rekod disimpan pada peranti ini sahaja."; return; }
  if(TALIAN.tertunggak>0){ e.className="talian tunggu"; e.textContent=TALIAN.tertunggak+" belum dihantar";
    e.title="Jawapan disimpan pada peranti ini dan akan dihantar apabila talian pulih."; return; }

/* ============================================================
   AKAUN GURU
   Pustaka Supabase hanya dimuatkan apabila mod cikgu dibuka, supaya
   telefon murid tidak perlu memuat turunnya.
   ============================================================ */
var SB=null, SB_JANJI=null, SESI=null, PROFIL=null;
var AUTH_SIAP=false, AUTH_GAGAL=false, AUTH_MULA=false, GURU_DIMUAT=false, GOOGLE_ADA=false;
var RALAT_GURU="", RALAT_AUTH="";
var SB_SKRIP="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js";
function asasUrl(){ return location.origin+location.pathname; }

function muatSupabase(){
  if(SB) return Promise.resolve(SB);
  if(SB_JANJI) return SB_JANJI;
  SB_JANJI=new Promise(function(ok,gagal){
    function cipta(){
      try{
        SB=window.supabase.createClient(AWAN.url,AWAN.kunci,{auth:{
          persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,
          flowType:"pkce",storageKey:"cn-auth"}});
        ok(SB);
      }catch(e){ gagal(e); }
    }
    if(window.supabase&&window.supabase.createClient) return cipta();
    var s=document.createElement("script");
    s.src=SB_SKRIP; s.async=true;
    s.onload=cipta;
    s.onerror=function(){ SB_JANJI=null; s.remove(); gagal(new Error("Failed to fetch")); };
    document.head.appendChild(s);
  });
  return SB_JANJI;
}

function mulaAuth(){
  if(AUTH_MULA) return;
  AUTH_MULA=true; AUTH_GAGAL=false;
  if(!AWAN){ AUTH_SIAP=true; return; }
  fetch(AWAN.url+"/auth/v1/settings",{headers:{apikey:AWAN.kunci}})
    .then(function(r){ return r.json(); })
    .then(function(j){ GOOGLE_ADA=!!(j&&j.external&&j.external.google); segarGuru(); })
    .catch(function(){});
  muatSupabase().then(function(sb){
    sb.auth.onAuthStateChange(function(ev,sesi){
      /* Jangan panggil Supabase terus dari dalam pendengar ini. */
      setTimeout(function(){
        if(ev==="PASSWORD_RECOVERY"){ S.guruSkrin="katabaru"; tukarMod("cikgu"); }
        tetapSesi(sesi);
      },0);
    });
    return sb.auth.getSession().then(function(r){
      bersihUrlAuth();
      tetapSesi(r.data&&r.data.session);
    });
  }).catch(function(){
    AUTH_MULA=false; AUTH_GAGAL=true; AUTH_SIAP=true; segarGuru();
  });
}

function bersihUrlAuth(){
  try{
    var u=new URL(location.href), ubah=false;
    ["code","error","error_code","error_description","state"].forEach(function(k){
      if(!u.searchParams.has(k)) return;
      if(k==="error_description") RALAT_AUTH=u.searchParams.get(k);
      u.searchParams.delete(k); ubah=true;
    });
    if(/access_token|error/.test(u.hash)){
      var m=/error_description=([^&]+)/.exec(u.hash);
      if(m) RALAT_AUTH=decodeURIComponent(m[1].replace(/\+/g," "));
      u.hash=""; ubah=true;
    }
    if(ubah) history.replaceState(null,"",u.pathname+u.search+u.hash);
  }catch(e){}
}

function tetapSesi(sesi){
  var lama=SESI&&SESI.user&&SESI.user.id, baru=sesi&&sesi.user&&sesi.user.id;
  SESI=sesi||null;
  if(lama===baru&&AUTH_SIAP) return;
  AUTH_SIAP=true;
  PROFIL=null; KELAS_GURU=[]; GURU_DIMUAT=false; RALAT_GURU="";
  if(S.gk!=="contoh") S.gk=null;
  if(!baru){ if(S.guruSkrin!=="katabaru") S.guruSkrin=null; segarGuru(); return; }
  segarGuru();
  muatProfil()
    .then(function(){ return (PROFIL&&PROFIL.ada) ? muatGuru() : null; })
    .catch(function(e){
      /* akaun sudah dipadam tetapi token lama masih dalam pelayar */
      if(e&&e.code==="23503"){ SB.auth.signOut(); return; }
      RALAT_GURU=pesanRalat(e); if(!PROFIL) PROFIL={nama:"",sekolah:"",ada:false};
    })
    .then(segarGuru);
}

/* Nombor telefon disimpan dalam bentuk antarabangsa tanpa tanda.
   012-345 6789 -> 60123456789. Pulangkan "" jika tidak sah. */
function normTelefon(v){
  var d=String(v||"").replace(/[^\d+]/g,"");
  var antarabangsa=d.charAt(0)==="+";
  d=d.replace(/\D/g,"");
  if(!antarabangsa){
    if(/^0/.test(d)) d="6"+d;
    else if(/^1\d{8,9}$/.test(d)) d="60"+d;
  }
  if(/^60/.test(d)) return /^601\d{8,9}$/.test(d)?d:"";
  return /^\d{9,15}$/.test(d)?d:"";
}
/* Profil lengkap memerlukan nama dan sekolah. Medan telefon wujud dalam
   pangkalan data tetapi belum diminta daripada guru buat masa ini. */
function muatProfil(){
  var uid=SESI.user.id;
  return SB.from("jm_guru").select("nama,sekolah,telefon,setuju_pemasaran,premium_rendah_tamat,premium_atas_tamat").eq("id",uid).maybeSingle().then(function(r){
    if(r.error) throw r.error;
    if(!SESI||SESI.user.id!==uid) return;
    var md=SESI.user.user_metadata||{}, d=r.data||{}, kini=new Date();
    PROFIL={nama:d.nama||md.nama||md.full_name||md.name||"",
            sekolah:d.sekolah||md.sekolah||"",
            telefon:d.telefon||normTelefon(md.telefon),
            setuju:r.data?!!d.setuju_pemasaran:!!md.setuju_pemasaran,
            simpanan:r.data?!!d.setuju_pemasaran:null,
            premiumRendahTamat:d.premium_rendah_tamat||null,
            premiumAtasTamat:d.premium_atas_tamat||null,
            premiumRendah:!!(d.premium_rendah_tamat&&new Date(d.premium_rendah_tamat)>kini),
            premiumAtas:!!(d.premium_atas_tamat&&new Date(d.premium_atas_tamat)>kini)};
    PROFIL.ada=!!d.nama;
    if(!PROFIL.ada&&md.nama&&md.sekolah)
      return simpanProfil(PROFIL.nama,PROFIL.sekolah,PROFIL.telefon,PROFIL.setuju);
  });
}
function simpanProfil(nama,sekolah,telefon,setuju){

    if(r.error) throw r.error;
    PROFIL={nama:nama,sekolah:sekolah,telefon:telefon,setuju:!!setuju,simpanan:!!setuju,ada:true,
            premiumRendahTamat:PROFIL?PROFIL.premiumRendahTamat:null,
            premiumAtasTamat:PROFIL?PROFIL.premiumAtasTamat:null,
            premiumRendah:PROFIL?PROFIL.premiumRendah:false,
            premiumAtas:PROFIL?PROFIL.premiumAtas:false};
  });
}

function muatGuru(){
  if(!SB||!SESI) return Promise.resolve();
  var bab=BAB_ID;
  return Promise.all([
    SB.from("jm_kelas").select("id,nama,kod,dicipta").order("dicipta"),
    SB.from("jm_murid").select("kelas,no,nama,pin"),
    SB.from("jm_cubaan").select("*").eq("bab",bab),

  ]).then(function(r){
    for(var i=0;i<r.length;i++) if(r[i].error) throw r[i].error;
    if(bab!==BAB_ID) return;
    KELAS_GURU=r[0].data.map(function(k){ return {id:k.id,nama:k.nama,kod:k.kod}; });
    KELAS_GURU.forEach(function(k){ NOMBOR[k.id]=[]; NAMA[k.id]={}; PIN[k.id]={}; });
    r[1].data.sort(function(a,b){ return Number(a.no)-Number(b.no); }).forEach(function(m){
      if(!NOMBOR[m.kelas]) return;
      NOMBOR[m.kelas].push({no:m.no}); NAMA[m.kelas][m.no]=m.nama; PIN[m.kelas][m.no]=m.pin;
    });
    r[2].data.forEach(function(c){
      CUBAAN[kunciC(c.kelas,c.no,c.aras)]={v:SKEMA,kelas:c.kelas,no:c.no,aras:c.aras,
        pertama:c.pertama,terbaik:c.terbaik,kali:c.kali,karangan:c.karangan,akhir:c.akhir};
    });
    r[3].data.forEach(function(t){ GURU[kunciG(t.kelas,t.no)]={tp:t.tp,sebab:t.sebab||""}; });
    GURU_DIMUAT=true; RALAT_GURU="";
    if(S.gk&&S.gk!=="contoh"&&!kelasGuruKini()) S.gk=null;
  });
}

function pesanRalat(e){
  var m=String((e&&(e.message||e.error_description||e.msg))||e||"");
  if(/Invalid login credentials/i.test(m)) return "E-mel atau kata laluan salah.";
  if(/already registered|already been registered|already exists/i.test(m)) return "E-mel ini sudah didaftarkan. Sila log masuk, atau tetapkan semula kata laluan.";
  if(/same.password|should be different/i.test(m)) return "Kata laluan baharu mesti berbeza daripada yang lama.";
  if(/Password should|at least|weak.password/i.test(m)) return "Kata laluan perlu sekurang-kurangnya 8 aksara.";
  if(/rate limit|too many|security purposes/i.test(m)) return "Terlalu banyak cubaan. Tunggu sebentar dan cuba lagi.";
  if(/valid email|invalid.*email|Unable to validate email/i.test(m)) return "Alamat e-mel tidak sah.";
  if(/Email not confirmed/i.test(m)) return "E-mel ini belum disahkan. Semak peti masuk cikgu.";
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return "Tidak dapat menghubungi pelayan. Semak internet dan cuba lagi.";
  if(/had 20 kelas/.test(m)) return "Setiap akaun boleh ada sehingga 20 kelas.";
  if(/had 60 murid/.test(m)) return "Setiap kelas boleh ada sehingga 60 murid.";
  if(/JWT expired|not authenticated/i.test(m)) return "Sesi log masuk tamat. Sila log masuk semula.";
  if(/permission denied|row-level security|bukan kelas anda/i.test(m)) return "Tiada kebenaran untuk tindakan ini. Muat semula halaman dan cuba lagi.";
  if(/provider is not enabled/i.test(m)) return "Log masuk Google belum diaktifkan.";
  return m||"Tidak berjaya. Cuba lagi.";
}

    });
    else kerja=SB.auth.resetPasswordForEmail(emel,{redirectTo:asasUrl()}).then(function(r){
      if(r.error) throw r.error;

  if(mod==="daftar") ak.appendChild(kadNilai());

function tukarBabGuru(id){

}
function pilihBabGuru(p){
  var semuaBab=senaraiBab(), tingKini=tingkatanBab(BAB_ID), premium=premiumAktif(tingKini);
  if(semuaBab.length<2) return;
  var tingAda=[1,2,3,4,5].filter(function(t){ return semuaBab.some(function(b){ return tingkatanBab(b.id)===t; }); });
  if(tingAda.length>1){
    var tr=el("div","actions tingguru");
    tingAda.forEach(function(t){
      var b=el("button","kbtn"); b.type="button"; b.textContent="Tingkatan "+t;
      b.setAttribute("aria-pressed",t===tingKini?"true":"false");
      if(t===tingKini){ b.style.borderColor="var(--vena)"; b.style.fontWeight="700"; }
      b.onclick=function(){
        var pertama=semuaBab.filter(function(x){ return tingkatanBab(x.id)===t; })[0];
        if(pertama) tukarBabGuru(pertama.id);
      };
      tr.appendChild(b);
    });
    p.appendChild(tr);
  }
  var babs=semuaBab.filter(function(b){ return tingkatanBab(b.id)===tingKini; });
  var ada_terkunci=false;
  var row=el("div","actions");
  babs.forEach(function(b){
    var kunci=!bebasBab(b.id)&&!premium;
    if(kunci) ada_terkunci=true;
    var t=el("button","kbtn"+(kunci?" terkunci":"")); t.type="button";
    t.innerHTML=(kunci?"\u{1F512} ":"\u{1F4D8} ")+esc(b.kod);
    t.setAttribute("aria-pressed",b.id===BAB_ID?"true":"false");
    if(kunci){
      t.title="Bab premium — naik taraf untuk buka";
      t.onclick=function(){ bukaWaNaikTaraf(tingkatanBab(b.id)<=3?"Menengah Rendah":"Menengah Atas"); };
    }
    else{
      if(b.id===BAB_ID){ t.style.borderColor="var(--vena)"; t.style.background="var(--surface)"; t.style.fontWeight="700"; }
      t.onclick=function(){ tukarBabGuru(b.id); };
    }
    row.appendChild(t);
  });
  p.appendChild(row);
  if(ada_terkunci&&!premium) row.parentNode.appendChild(el("span","note akan-datang-guru",
    "\u{1F512} Bab premium dikunci. Naik taraf pada harga perintis RM23/tahun (hingga 31 Dis) untuk buka semua bab "+(tingKini<=3?"Menengah Rendah (T1-3)":"Menengah Atas (T4-5)")+"."));
}

function pinRawak(){
  try{ var a=new Uint32Array(1); crypto.getRandomValues(a); return String(1000+(a[0]%9000)); }
  catch(e){ return String(1000+Math.floor(Math.random()*9000)); }
}
function senaraiSemasa(kelas){
  return nomborKelas(kelas).map(function(m){
    return {no:m.no,nama:(NAMA[kelas]||{})[m.no]||"",pin:(PIN[kelas]||{})[m.no]||pinRawak()};
  });
}
function pasangSenarai(kelas,list){
  NOMBOR[kelas]=list.map(function(m){ return {no:m.no}; });
  NAMA[kelas]={}; PIN[kelas]={};
  list.forEach(function(m){ NAMA[kelas][m.no]=m.nama; PIN[kelas][m.no]=m.pin; });
}
function simpanMurid(kelas,list){
  if(kelas==="contoh"){ pasangSenarai(kelas,list); return Promise.resolve(); }
  return SB.rpc("jm_guru_simpan_murid",{p_kelas:kelas,p_murid:list}).then(function(r){
    if(r.error) throw r.error;
    pasangSenarai(kelas,list);
  });
}
/* Nombor murid tidak pernah diguna semula. Rekod disimpan mengikut nombor,
   jadi murid baharu tidak boleh mewarisi rekod murid yang sudah dibuang. */
function noSeterusnya(kelas){
  var max=0;
  function ambil(n){ n=Number(n); if(n>max) max=n; }
  nomborKelas(kelas).forEach(function(m){ ambil(m.no); });
  Object.keys(CUBAAN).forEach(function(k){ var c=CUBAAN[k]; if(c&&c.kelas===kelas) ambil(c.no); });
  if(kelas==="contoh") return Promise.resolve(max+1);
  return SB.from("jm_cubaan").select("no").eq("kelas",kelas).then(function(r){
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(x){ ambil(x.no); });
    return SB.from("jm_tp").select("no").eq("kelas",kelas);
  }).then(function(r){
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(x){ ambil(x.no); });
    return max+1;
  });
}

var QR_SKRIP="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";

function muatQr(){

    s.onerror=function(){ QR_JANJI=null; s.remove(); gagal(new Error("Failed to fetch")); };

}

/* ---------------- Import senarai murid ----------------
   Guru boleh memuat naik fail Excel, CSV atau teks (termasuk eksport APDM),
   atau menampal jadual terus dari Excel. Lajur Nama dan Kelas dikenal pasti
   sendiri. Jika fail mempunyai satu helaian bagi setiap kelas, nama helaian
   dijadikan nama kelas. PIN setiap murid dijana di sini. */
var XLSX_SKRIP="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
var XLSX_JANJI=null;
function muatXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(XLSX_JANJI) return XLSX_JANJI;
  XLSX_JANJI=new Promise(function(ok,gagal){
    var s=document.createElement("script"); s.src=XLSX_SKRIP; s.async=true;
    s.onload=function(){ ok(window.XLSX); };
    s.onerror=function(){ XLSX_JANJI=null; s.remove(); gagal(new Error("Failed to fetch")); };
    document.head.appendChild(s);
  });
  return XLSX_JANJI;
}
function huraiCsv(t){
  t=String(t||"").replace(/^\uFEFF/,"");
  var baris1=t.split(/\r?\n/)[0]||"";
  var sep=(baris1.split(";").length>baris1.split(",").length)?";":(baris1.indexOf("\t")>=0?"\t":",");
  var out=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); out.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f||row.length){ row.push(f); out.push(row); }
  return out;
}
/* Teks tampal: lajur dipisah tab (dari Excel). Satu lajur jika tiada tab. */
function huraiTampal(t){
  return String(t||"").replace(/^\uFEFF/,"").split(/\r?\n/).map(function(b){ return b.split("\t"); });
}
function bacaFail(fail){
  var ext=(fail.name.split(".").pop()||"").toLowerCase();
  if(ext==="csv"||ext==="txt"||ext==="tsv"){
    return fail.text().then(function(t){ return [{nama:null,baris:huraiCsv(t)}]; });
  }
  if(["xlsx","xls","xlsm","ods"].indexOf(ext)<0)
    return Promise.reject(new Error("Jenis fail tidak disokong. Guna Excel (.xlsx, .xls) atau CSV."));
  return muatXlsx().then(function(X){
    return fail.arrayBuffer().then(function(buf){
      var wb=X.read(buf,{type:"array"});
      return wb.SheetNames.map(function(n){
        return {nama:n,baris:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:"",blankrows:false})};
      });
    });
  });
}

var PENYAMBUNG_KECIL=/^(bin|binti|bt|bte|b\.|bt\.|a\/l|a\/p|s\/o|d\/o|anak|ak)$/;
/* APDM menulis nama dalam HURUF BESAR. Tukar kepada huruf nama biasa. */
function hurufNama(s){
  if(s!==s.toUpperCase()||!/[A-Z]/.test(s)) return s;
  return s.toLowerCase().split(" ").map(function(w){
    if(PENYAMBUNG_KECIL.test(w)) return w;
    return w.replace(/(^|[-'’(@])([a-z])/g,function(m,a,b){ return a+b.toUpperCase(); });
  }).join(" ");
}
function bersihNama(v){
  var s=String(v==null?"":v).replace(/\u00A0/g," ").replace(/^\s*\d+\s*[\.\)\-:]?\s+/,"").replace(/\s+/g," ").trim();
  if(s.length<2||s.length>120) return "";
  if(!/[A-Za-zÀ-ɏ一-鿿]/.test(s)) return "";
  if(/^\d{6}-?\d{2}-?\d{4}$/.test(s)||/@/.test(s)) return "";
  if(/^(nama|name|nama murid|nama pelajar|bil|no)$/i.test(s)) return "";
  return hurufNama(s);
}
function tajukLajur(baris){
  for(var r=0;r<Math.min(12,baris.length);r++){
    var row=baris[r]||[], nc=-1, kc=-1;
    for(var i=0;i<row.length;i++){
      var c=String(row[i]||"").trim().toLowerCase();
      if(!c||c.length>30||/\d/.test(c)||c.split(/\s+/).length>4) continue;
      if(nc<0&&/nama|name/.test(c)&&!/kelas|class|sekolah|bapa|ibu|penjaga|guru|waris|senarai/.test(c)) nc=i;
      else if(kc<0&&/^(kelas|class|nama kelas|kelas murid|tingkatan\s*\/\s*kelas|ting\.?\s*\/\s*kelas)$/.test(c)) kc=i;
    }
    if(nc>=0) return {r:r,nama:nc,kelas:kc};
  }
  return null;
}
/* Tiada tajuk: dalam setiap baris, ambil sel yang paling mirip nama orang
   (ada huruf, tiada nombor selepas nombor giliran dibuang, paling banyak
   perkataan). Ini tahan terhadap tampalan yang bercampur format. */
function namaDalamBaris(row){
  var terbaik="", nilai=0;
  (row||[]).forEach(function(c){
    var n=bersihNama(c);
    if(!n||/\d/.test(n)) return;
    /* baris tajuk dokumen, bukan nama murid */
    if(/\b(senarai|sekolah|smk|kelas|tingkatan|jumlah|guru|murid|pelajar)\b/i.test(n)) return;
    var v=n.split(" ").length*10+Math.min(n.length,40);
    if(v>nilai){ nilai=v; terbaik=n; }
  });
  return terbaik;
}
function kiraRupaNama(baris){
  var n=0;
  (baris||[]).forEach(function(row){ (row||[]).forEach(function(c){ if(bersihNama(c)&&String(c).trim().split(/\s+/).length>=2) n++; }); });
  return n;
}
/* -> [{kelas:"3 Amanah" atau "", nama:[...]}] */
function kenalSenarai(helaian){
  var kump={}, susunan=[];
  function tambah(k,n){ k=hurufNama(String(k||"").replace(/\s+/g," ").trim()); if(!kump[k]){ kump[k]=[]; susunan.push(k); } kump[k].push(n); }
  var berisi=helaian.filter(function(h){ return kiraRupaNama(h.baris)>=3; });
  var ikutHelaian=berisi.length>1;
  helaian.forEach(function(h){
    var baris=h.baris||[]; if(!baris.length) return;
    if(ikutHelaian&&berisi.indexOf(h)<0) return;
    var t=tajukLajur(baris), mula=0, nc=-1, kc=-1;
    if(t){ mula=t.r+1; nc=t.nama; kc=t.kelas; }
    for(var r=mula;r<baris.length;r++){
      var row=baris[r]||[];
      var n=nc>=0?bersihNama(row[nc]):namaDalamBaris(row);
      if(!n) continue;
      var k=kc>=0?row[kc]:(ikutHelaian?h.nama:"");
      tambah(k,n);
    }
  });
  return susunan.map(function(k){ return {kelas:k,nama:kump[k]}; });
}

function kuncinama(s){ return String(s||"").toLowerCase().replace(/\s+/g," ").trim(); }
function cariKelasGuru(nama){
  var k=kuncinama(nama).replace(/\s/g,"");
  if(!k) return null;
  for(var i=0;i<KELAS_GURU.length;i++) if(kuncinama(KELAS_GURU[i].nama).replace(/\s/g,"")===k) return KELAS_GURU[i];
  return null;
}
/* Tambah nama ke kelas. Nama yang sudah ada dalam kelas dilangkau, supaya
   fail yang sama boleh dimuat naik semula tanpa murid berganda. */
function tambahMurid(kelas,senarai){
  var sedia=senaraiSemasa(kelas), ada={};
  sedia.forEach(function(m){ ada[kuncinama(m.nama)]=1; });
  var baru=senarai.filter(function(n){ return !ada[kuncinama(n)]; });
  if(!baru.length) return Promise.resolve({baru:0,langkau:senarai.length});
  if(sedia.length+baru.length>60) return Promise.reject(new Error("had 60 murid"));
  return noSeterusnya(kelas).then(function(mula){
    var list=sedia.concat(baru.map(function(n,i){ return {no:String(mula+i),nama:n,pin:pinRawak()}; }));
    return simpanMurid(kelas,list);
  }).then(function(){ return {baru:baru.length,langkau:senarai.length-baru.length}; });
}
function ciptaKelas(nama){
  return SB.from("jm_kelas").insert({nama:nama}).select("id,nama,kod").single().then(function(r){
    if(r.error) throw r.error;
    var k={id:r.data.id,nama:r.data.nama,kod:r.data.kod};
    KELAS_GURU.push(k); NOMBOR[k.id]=[]; NAMA[k.id]={}; PIN[k.id]={};
    return k;
  });
}

function eksport(){

  if(!k) return;
  var baris=[["Bil","No. Murid","Nama Murid","Kelas","Mata Pelajaran","Bab","Tahap Penguasaan",
              "TP Cadangan Sistem","Ditindih Guru","Sebab Penindihan","Bilangan Percubaan",
              "Tugasan TP6 Dihantar","Jenis Rekod","Ulasan"]];
  senaraiMurid(kelas).forEach(function(no,i){
    var auto=tpAuto(kelas,no), lapor=tpDilapor(kelas,no), g=guruUntuk(kelas,no);
    baris.push([i+1,no,namaMurid(kelas,no),k.nama,"Matematik",BAB.kod,"TP"+lapor,
      "TP"+auto,(lapor!==auto?"Ya":"Tidak"),(g&&g.sebab)||"",
      bilCubaan(kelas,no), (adaKarangan(kelas,no)?"Ya":"Tidak"),
      (k.contoh?"CONTOH":"Sebenar"),
      ulasanUntuk(namaMurid(kelas,no),lapor)]);
  });
  var csv=baris.map(function(r){return r.map(selCsv).join(",");}).join("\r\n");
  var kotak=$("kotakEksport"); if(!kotak) return; kotak.innerHTML="";
  function papar(){
    var w=el("div","ulasan");

    var ta=el("textarea"); ta.value=csv; ta.style.minHeight="150px";
    ta.style.fontFamily="'DM Mono',monospace"; ta.style.fontSize="13px";
    w.appendChild(ta); kotak.appendChild(w);
    if(window.innerWidth>700){ ta.focus(); ta.select(); }
  }
  papar();
  try{
    var nama="pbd-"+BAB_ID+"-"+String(k.nama).replace(/\s+/g,"-").toLowerCase()+".csv";
    var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=el("a"); a.href=url; a.download=nama; a.className="btn sm"; a.textContent="Muat turun "+nama;
    a.style.display="inline-block"; a.style.textDecoration="none"; a.style.lineHeight="22px";
    var bar=el("div","actions"); bar.appendChild(a); kotak.insertBefore(bar,kotak.firstChild);
    setTimeout(function(){ URL.revokeObjectURL(url); },120000);
  }catch(e){}
}

   ============================================================ */
function mula(){
  pasangBab(BAB_ID);
  bersihLama();
  benihContoh();
  benihContohBab();
  muatTempatan();
  kemasIkonBunyi();
  kemasMinggu();

  /* ?k=KOD daripada pautan cikgu; ?code=... daripada log masuk Google atau
     pautan tetapan semula kata laluan */
  var qk=null, authUrl=false, modLama=null, qdemo=null, qm=null, qp=null;
  try{
    var u=new URL(location.href);
    qk=u.searchParams.get("k");
    /* Pautan peribadi ?k=KOD&m=NO&p=PIN (QR pada slip, atau WhatsApp daripada
       cikgu): murid terus masuk tanpa cari nama dan taip PIN. PIN dibuang
       dari bar alamat serta-merta supaya tidak tertinggal dalam sejarah. */
    qm=u.searchParams.get("m"); qp=u.searchParams.get("p");
    if(!/^[0-9]{4}$/.test(qp||"")||!qm){ qm=null; qp=null; }
    u.searchParams.delete("m"); u.searchParams.delete("p");
    qdemo=u.searchParams.get("demo");
    /* ?main dikekalkan dalam URL supaya keluarga yang simpan pautan ini
       kekal dalam mod main bebas. Pautan biasa (tanpa ?main) sentiasa
       bermula di skrin kod kelas. */
    if(u.searchParams.has("main")) qdemo="bebas";
    if(qdemo&&qdemo!=="bebas"){ u.searchParams.delete("demo"); history.replaceState(null,"",u.pathname+u.search+u.hash); }
    authUrl=u.searchParams.has("code")||u.searchParams.has("error_description")||/access_token|error_description/.test(u.hash);
    if(qk) u.searchParams.delete("k");
    if(u.search!==location.search) history.replaceState(null,"",u.pathname+u.search+u.hash);
  }catch(e){}
  var qdaftar=false;
  try{ var up=new URL(location.href); modLama=(up.searchParams.has("cikgu")||up.searchParams.has("daftar"))?"cikgu":null; qdaftar=up.searchParams.has("daftar"); }catch(e){ modLama=null; }

  if(S.no&&KM&&S.kod){ S.lulus=kiraLulus(); var t=tpDicapai(S.lulus); S.aras=(t>0&&t<6)?t+1:(t===6?6:1); S.skrin="peta"; }
  else if(S.latihan&&qdemo==="bebas"){ S.skrin="peta"; muatLatihan(); }
  else if(S.latihan){ S.latihan=false; S.skrin=KM?"nama":"kodkelas"; }
  else if(KM) S.skrin="nama";
  else S.skrin="kodkelas";

  if(qk&&qm){ masukPautanPeribadi(normKod(qk),qm,qp); }
  else if(qk){
    var kod=normKod(qk);
    if(!KM||KM.kod!==kod){
      S.latihan=false; S.kodDraf=kod; S.skrin="kodkelas";
      bukaKelas(kod).then(function(ok){
        if(ok){ S.kodDraf=""; S.skrin="nama"; }
        else S.mesej="Kod kelas dalam pautan itu tidak dijumpai. Semak dengan cikgu.";
        render();
      }).catch(function(){ render(); });
    } else if(!S.no){ S.latihan=false; S.skrin="nama"; }
  }

  if(qdemo==="murid"&&!qk&&!authUrl){ S.latihan=true; S.no=null; S.lulus={}; S.aras=1; S.skrin="peta"; simpanDiri(); }
  if(qdemo==="bebas"&&!qk&&!authUrl&&!(S.no&&S.kod)){ S.latihan=true; S.no=null; S.skrin="peta"; muatLatihan(); simpanDiri(); }
  if(S.latihan){
    var sekali=false;
    try{ sekali=!sessionStorage.getItem("cn-ping-buka"); if(sekali) sessionStorage.setItem("cn-ping-buka","1"); }catch(e){ sekali=true; }
    if(sekali) ping("buka",BAB_ID);
  }

  render();
  lukisTalian();
  muatJauh();
  if(qdemo==="cikgu"&&!qk&&!authUrl){ DEMO_GURU=true; S.gk="contoh"; S.tabCikgu="kelas"; tukarMod("cikgu"); }
  else if((qdemo==="murid"||qdemo==="bebas")&&!qk&&!authUrl) tukarMod("murid");
  else if(authUrl||(modLama==="cikgu"&&!qk)){
    if(qdaftar&&!SESI) S.authMod="daftar";
    tukarMod("cikgu");
  }
}
mula();

})();
</script>
