<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jejak TP Matematik: pentaksiran bilik darjah untuk Matematik KSSM Tingkatan 1, 2 dan 3. Setiap bidang pembelajaran menjadi satu perjalanan enam hentian yang dipetakan kepada Tahap Penguasaan 1 hingga 6.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070D18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Jejak TP Matematik</title>
<style>
  :root{color-scheme:light}
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none !important}

sup{font-size:.72em;line-height:0;vertical-align:baseline;position:relative;top:-.45em}
/* ---- Rajah interaktif (Matematik) ---- */
figure.jmi{position:relative}
.jmi-petunjuk{display:inline-block;font:600 12px "Figtree",system-ui,sans-serif;color:var(--tinta);background:var(--dunia-lembut,var(--amber-soft));border:1.5px solid var(--dunia,var(--vena));border-radius:99px;padding:3px 11px;margin:0 0 8px}
.jmi-kawal{display:flex;flex-direction:column;gap:10px;margin:10px 0 4px}
.jmi-baris{display:flex;align-items:center;gap:12px}
.jmi-label{font:600 14px "DM Mono",monospace;color:var(--tinta);min-width:118px}
.jmi-label b{color:var(--dunia,var(--vena));font-size:16px}
.jmi-baris input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--dunia,var(--vena));touch-action:pan-y}
.jmi-btn{flex:1;min-height:48px;border:2px solid var(--dunia,var(--vena));background:var(--surface);color:var(--tinta);border-radius:14px;font:700 15px "Baloo 2",system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--dunia-gelap,var(--vena));transition:transform .06s,box-shadow .06s}
.jmi-btn:active{transform:translateY(3px);box-shadow:none}
.jmi-btn:focus-visible,.jmi-baris input:focus-visible{outline:3px solid var(--dunia,var(--vena));outline-offset:2px}
.jmi-svg svg{transition:none}
@media (prefers-reduced-motion:reduce){.jmi-btn{transition:none}}
</style>
<!-- Fon disimpan dalam app (tools/muat-fon.js), bukan dimuat dari Google -->
<link rel="stylesheet" href="fon/fon.css">
<script>if("serviceWorker" in navigator&&location.protocol!=="file:"){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
<style>
:root{
  --ground:#EDF0F5;
  --surface:#FFFFFF;
  --surface2:#F6F8FC;
  --ink:#0D1B2E;
  --ink2:#3D5068;
  --ink3:#6C7F96;
  --line:#DBE2EC;
  --line2:#C3CFDE;
  --arteri:#C8102E;
  --arteri-soft:#FBE8EB;
  --vena:#25395C;
  --teal:#0E8C7F;
  --teal-soft:#DFF2EF;
  --amber:#B07208;
  --amber-soft:#FBF0DB;
  --gen:#5B3DE0;
  --gen-soft:#EEE9FB;
  --shadow:0 1px 2px rgba(13,27,46,.06),0 8px 24px -14px rgba(13,27,46,.22);
  --shadow-lift:0 2px 6px rgba(13,27,46,.10),0 20px 44px -20px rgba(13,27,46,.34);
  --r:15px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#070D18;--surface:#0F1A2B;--surface2:#16243A;--ink:#E8EEF8;--ink2:#AABCD3;
    --ink3:#7B8EA8;--line:#1E2D45;--line2:#2B3E5B;--arteri:#FF6068;--arteri-soft:#2B1620;
    --vena:#8AA3CC;--teal:#2FC2AE;--teal-soft:#0C2B29;--amber:#F0B255;--amber-soft:#2A2013;
    --gen:#B29DFF;--gen-soft:#241D3D;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -14px rgba(0,0,0,.8);
    --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 20px 44px -20px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#070D18;--surface:#0F1A2B;--surface2:#16243A;--ink:#E8EEF8;--ink2:#AABCD3;
  --ink3:#7B8EA8;--line:#1E2D45;--line2:#2B3E5B;--arteri:#FF6068;--arteri-soft:#2B1620;
  --vena:#8AA3CC;--teal:#2FC2AE;--teal-soft:#0C2B29;--amber:#F0B255;--amber-soft:#2A2013;
  --gen:#B29DFF;--gen-soft:#241D3D;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 20px 44px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
button,input,textarea{-webkit-tap-highlight-color:rgba(0,0,0,.07)}
button{touch-action:manipulation;font:inherit;color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",sans-serif;margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.018em}
p{margin:0}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
:focus-visible{outline:2px solid var(--arteri);outline-offset:3px;border-radius:8px}
.hidden{display:none !important}
.shell{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
/* Jenama payung NaikGred — sokongan sahaja, tidak menggantikan jenama produk. */
.jenama-kaki{--ng1:#86CEBD;--ng2:#0C6B5E;--ng3:#F0A62F;--ngN:#0C6B5E;--ngG:#E09517;
  display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  margin-top:36px;padding-block:18px 2px;border-top:1px solid var(--line);
  color:var(--ink3);font-size:12px;line-height:1.5}
.jenama-kaki svg{width:18px;height:18px;flex:none;display:block}
.jenama-kaki .ngw{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.015em;font-size:13px}
.jenama-kaki .ngw i{font-style:normal;font-weight:600;color:var(--ngN)}
.jenama-kaki .ngw b{font-weight:800;color:var(--ngG)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .jenama-kaki{--ng1:#2F8874;--ng2:#7ED3BF;--ng3:#FFC24D;--ngN:#7ED3BF;--ngG:#FFC24D}
}
:root[data-theme="dark"] .jenama-kaki{--ng1:#2F8874;--ng2:#7ED3BF;--ng3:#FFC24D;--ngN:#7ED3BF;--ngG:#FFC24D}
@media print{.jenama-kaki{display:none}}

/* ---------- bar atas ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .topbar{background:color-mix(in srgb,var(--ground) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
}
.topbar-in{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
/* Tanpa min-width:0 pada bekas dalam, nama app yang nowrap ini melimpah
   keluar .brand dan bertindih dengan butang Main/Cikgu pada telefon. */
.brand>div{min-width:0}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){.brand b{font-size:15px;white-space:normal;line-height:1.05}.brand span{display:none}}
.brand span{display:block;font-size:11px;color:var(--ink3);line-height:1.1;margin-top:1px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink3);white-space:nowrap;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:999px;cursor:pointer;display:grid;place-items:center;font-size:16px;flex:none}

/* ---------- meter nafas ---------- */
.hud{
  position:sticky;top:58px;z-index:30;
  background:var(--vena);border-radius:var(--r);padding:13px 15px;margin-top:16px;box-shadow:var(--shadow-lift);
  display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;color:#fff;
}
:root[data-theme="dark"] .hud{background:#14243D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hud{background:#14243D}}
.hud .lbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.68;display:block}
.hud .val{font-family:"DM Mono",monospace;font-size:21px;line-height:1.15;font-weight:500}
.nafasbar{height:13px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:6px;position:relative}
.nafasbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4FD1C5,#7BE8D4);transition:width .28s ease}
.nafasbar.lemas i{background:linear-gradient(90deg,#FF7A5C,#FFB088)}
.nafasbar.lemas{animation:berdenyut .55s ease-in-out infinite}
@keyframes berdenyut{0%,100%{opacity:1}50%{opacity:.55}}
.hud .kombo{text-align:right}
.hud .kombo .val{color:#FFD48A}
@media (max-width:560px){
  .hud{grid-template-columns:1fr auto;gap:10px;padding:11px 13px}
  .hud .kombo{grid-row:1;grid-column:2}
  .hud .skor{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
  .hud .skor .val{font-size:17px}
}

/* ---------- kad panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-top:16px}
.panel-hd{padding:17px 19px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.panel-hd .grow{flex:1 1 220px;min-width:0}
.panel-hd h2{font-size:23px}
.panel-bd{padding:19px}
.tp-chip{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.07em;padding:5px 10px;border-radius:999px;background:var(--arteri-soft);color:var(--arteri);white-space:nowrap;font-weight:500}
.tp-chip.t{background:var(--teal-soft);color:var(--teal)}
.tp-chip.a{background:var(--amber-soft);color:var(--amber)}

/* ---------- peta kanvas ---------- */
#peta{display:block;width:100%;height:auto;aspect-ratio:900/210;max-width:100%}
@media (max-width:600px){#peta{aspect-ratio:520/230}}
.stopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-top:16px}
.stop{
  border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:74px;
}
.stop:hover{border-color:var(--line2)}
.stop .top{display:flex;align-items:center;gap:7px}
.stop .dot{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;flex:none;border:2px solid var(--line2);background:var(--surface);font-family:"DM Mono",monospace;font-size:12px;color:var(--ink3)}
.stop[data-s="aktif"]{border-color:var(--arteri)}
.stop[data-s="aktif"] .dot{border-color:var(--arteri);background:var(--arteri);color:#fff}
.stop[data-s="lulus"]{border-color:var(--teal)}
.stop[data-s="lulus"] .dot{border-color:var(--teal);background:var(--teal);color:#fff}
.stop .nm{font-weight:650;font-size:13.5px;line-height:1.25}
.stop .tp{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--ink3)}

/* ---------- soalan ---------- */
.qtext{font-size:19px;line-height:1.4;font-weight:600;letter-spacing:-.01em}
.qnote{font-size:13.5px;color:var(--ink3);margin-top:7px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;cursor:pointer;
  font-size:15px;line-height:1.4;min-height:48px;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--line2);background:var(--surface2)}
.opt .key{flex:none;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3);margin-top:1px}
.opt[data-pick="1"]{border-color:var(--vena);background:var(--surface2)}
.opt[data-pick="1"] .key{border-color:var(--vena);background:var(--vena);color:#fff}
.opt[data-mark="ok"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[data-mark="ok"] .key{border-color:var(--teal);background:var(--teal);color:#fff}
.opt[data-mark="no"]{border-color:var(--arteri);background:var(--arteri-soft)}
.opt[data-mark="no"] .key{border-color:var(--arteri);background:var(--arteri);color:#fff}
.opt[data-mark="miss"]{border-color:var(--teal);border-style:dashed}
.opt:disabled{cursor:default}
.opt .ord{flex:none;width:23px;height:23px;border-radius:999px;background:var(--vena);color:#fff;display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:11px;margin-top:1px}
.numrow{display:flex;gap:10px;align-items:center;margin-top:15px;flex-wrap:wrap}
.numrow input{font-family:"DM Mono",monospace;font-size:22px;width:130px;padding:11px 13px;border:1.5px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--ink)}
textarea.free{width:100%;min-height:160px;resize:vertical;margin-top:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:13px;font:inherit;font-size:16px;line-height:1.5}

.datatable{width:100%;border-collapse:collapse;font-size:14px}
.datatable th,.datatable td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
.datatable th{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;background:var(--surface2)}
.datatable td.n,.datatable th.n{text-align:right}
.datatable td.n{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.datatable tbody tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto;border:1px solid var(--line);border-radius:11px;margin-top:14px;-webkit-overflow-scrolling:touch}
/* Jadual yang lebih lebar daripada skrin telefon: murid perlu tahu masih ada
   lajur di sebelah kanan, kerana sesetengah soalan bergantung pada lajur itu. */
.leret-bungkus{position:relative}
.leret-bungkus.leret::after{
  content:"";position:absolute;top:1px;right:1px;bottom:1px;width:34px;pointer-events:none;
  border-radius:0 10px 10px 0;background:linear-gradient(90deg,transparent,var(--surface));
}
.leret-bungkus.leret.hujung::after{display:none}
.leret-nota{display:none;font-size:12px;color:var(--vena);font-weight:600;margin-top:6px}
.leret-bungkus.leret + .leret-nota{display:block}
@media (max-width:560px){
  .datatable{font-size:12.5px}
  .datatable th,.datatable td{padding:7px 8px}
  .datatable th{font-size:9.5px;letter-spacing:.06em}
}
/* margin-inline:0 penting: <figure> mewarisi margin 40px kiri dan kanan
   daripada pelayar, yang mengecilkan setiap rajah sebanyak 80px dan
   menjadikan teksnya terlalu kecil untuk dibaca pada telefon. */
.figure{margin:14px 0 0;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--surface2)}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:11.5px;color:var(--ink3);margin-top:7px;font-family:"DM Mono",monospace}

.fb{margin-top:15px;border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.5;border:1.5px solid}
.fb.ok{background:var(--teal-soft);border-color:var(--teal)}
.fb.no{background:var(--arteri-soft);border-color:var(--arteri)}
.fb b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:15.5px;margin-bottom:2px}

.actions{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:11px;padding:12px 21px;font-size:15px;font-weight:650;cursor:pointer;background:var(--arteri);color:#fff;box-shadow:var(--shadow);min-height:46px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line2);box-shadow:none}
.btn.teal{background:var(--teal)}
.btn.sm{padding:9px 15px;font-size:13.5px;min-height:44px}

/* pips */
/* Sembilan titik kemajuan melimpah keluar panel pada telefon 320px jika
   ia tidak dibenarkan mengecut, jadi setiap titik berkongsi ruang. */
.pips{display:flex;gap:5px;flex:1 1 auto;min-width:0}
.pip{flex:1 1 0;min-width:0;max-width:24px;height:5px;border-radius:3px;background:var(--line2)}
.pip.on{background:var(--vena)}
.pip.ok{background:var(--teal)}
.pip.no{background:var(--arteri)}

/* bos */
.bospanel{border-color:var(--arteri);box-shadow:0 0 0 3px var(--arteri-soft),var(--shadow-lift)}
.bostimer{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.bostimer i{display:block;height:100%;background:var(--arteri);transition:width .95s linear}

/* hasil */
.result{text-align:center;padding:30px 18px}
.result h2{font-size:26px;margin-bottom:7px}
.result p{color:var(--ink2);max-width:44ch;margin:0 auto;font-size:15px}
.kadbesar{
  width:190px;margin:0 auto 18px;border-radius:16px;padding:18px 15px;
  background:linear-gradient(160deg,var(--vena),#0C1729);color:#fff;box-shadow:var(--shadow-lift);
}
.kadbesar .em{font-size:38px;line-height:1}
.kadbesar .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;margin-top:8px}
.kadbesar .ft{font-size:12px;opacity:.78;margin-top:6px;line-height:1.4}
.badbig{width:88px;height:88px;border-radius:999px;margin:0 auto 16px;display:grid;place-items:center;font-size:38px;background:var(--arteri-soft);border:2px solid var(--arteri)}

/* koleksi kad */
.kadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
.kad{border-radius:14px;padding:14px 13px;background:linear-gradient(160deg,var(--vena),#0C1729);color:#fff;min-height:132px;display:flex;flex-direction:column;gap:5px}
.kad.kunci{background:var(--surface2);color:var(--ink3);border:1px dashed var(--line2)}
.kad .em{font-size:26px;line-height:1}
.kad .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:14.5px}
.kad .ft{font-size:11.5px;opacity:.8;line-height:1.4}
.kad.kunci .ft{opacity:1}

/* papan pendahulu */
.papan{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.prow:last-child{border-bottom:0}
.prow .rk{font-family:"DM Mono",monospace;color:var(--ink3);font-size:13px}
.prow.saya{font-weight:700}
.prow.saya .rk{color:var(--arteri)}
.prow .sk{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}

/* cabaran harian */
.harian{
  display:flex;gap:13px;align-items:center;border:1.5px solid var(--amber);background:var(--amber-soft);
  border-radius:13px;padding:13px 15px;margin-top:16px;flex-wrap:wrap;
}
.harian .txt{flex:1 1 190px;min-width:0}
.harian .t{font-weight:700;font-size:15px}
.harian .d{font-size:13px;color:var(--ink2)}

/* cikgu */
/* Tab dibiar berbalut, bukan menatal. Lima tab memerlukan 542px sedangkan
   jalur ini hanya 357px pada telefon 390px, jadi "Diagnostik" dan "Tangga TP"
   berada di luar skrin tanpa sebarang tanda ia wujud — dan "Nama & PIN"
   berakhir tepat di tepi bekas, jadi ia nampak seperti tab terakhir. Cikgu
   membuat kesimpulan ada tiga tab, lalu tab yang paling berguna kepadanya
   tidak pernah dijumpai. */
.tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--surface2)}
.tabs button{border:0;background:transparent;padding:13px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--arteri)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;border-left:0;border-right:0;border-top:0;background:transparent;width:100%;min-height:56px}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--surface2)}
.row>span:first-child{min-width:0}
.row .nm{font-weight:600;font-size:15px}
.row .meta{font-size:12px;color:var(--ink3);font-family:"DM Mono",monospace}
.tpbar{display:flex;gap:3px}
.tpbar i{width:9px;height:20px;border-radius:2px;background:var(--line2);display:block}
.tpbar i.on{background:var(--teal)}
/* TP rendah diberi warna supaya cikgu dapat mengesannya sekali imbas.
   Dalam kelas 27 murid, TP1 dan TP5 yang sama berat visual bermakna
   cikgu terpaksa membaca setiap baris satu per satu. Warna sahaja tidak
   memadai, jadi nombor TP itu sendiri kekal sebagai penanda utama. */
.tpbig{font-family:"DM Mono",monospace;font-size:18px;min-width:44px;text-align:right;font-weight:600}
.tpbig[data-tp="0"],.tpbig[data-tp="1"],.tpbig[data-tp="2"]{color:var(--arteri)}
.tpbig[data-tp="3"]{color:var(--amber)}
.tpbig[data-tp="5"],.tpbig[data-tp="6"]{color:var(--teal)}
.ulasan{margin:10px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ulasan-hd{background:var(--surface2);padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ulasan-hd .nm{font-weight:700;font-size:14px}
.ulasan textarea{width:100%;border:0;background:var(--surface);color:var(--ink);padding:14px;font:inherit;font-size:16px;line-height:1.55;min-height:120px;resize:vertical;display:block}
.ladder{display:flex;flex-direction:column;gap:10px;margin-top:13px}
.rung{border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.rung-hd{display:flex;gap:9px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.rung-hd .k{font-weight:700;font-size:15px}
.rung-hd .n{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink3)}
.rung p{font-size:13.5px;color:var(--ink2);line-height:1.5}
.note{font-size:13px;color:var(--ink3);line-height:1.55;margin-top:15px}

/* ---------- juice ---------- */
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .2s ease}
#flash.on{opacity:1}
#flash.ok{box-shadow:inset 0 0 0 4px var(--teal),inset 0 0 70px -12px var(--teal)}
#flash.no{box-shadow:inset 0 0 0 4px var(--arteri),inset 0 0 70px -12px var(--arteri)}
.apung{
  position:fixed;z-index:61;pointer-events:none;white-space:nowrap;
  font-family:"DM Mono",monospace;font-weight:500;font-size:19px;
  text-shadow:0 1px 3px rgba(0,0,0,.35);animation:naik 1s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes naik{
  0%{opacity:0;transform:translate(-50%,6px) scale(.86)}
  18%{opacity:1;transform:translate(-50%,-6px) scale(1.08)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}
}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.13)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}
.opt[data-mark="ok"]{animation:pop .45s ease}

/* ---------- kuasa ---------- */
.kuasa{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.kuasa .tajuk{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);width:100%}
.kbtn{
  display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--surface2);
  border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:650;cursor:pointer;min-height:44px;
}
.kbtn:hover:not(:disabled){border-color:var(--teal)}
.kbtn:disabled{opacity:.38;cursor:not-allowed}
.kbtn em{font-style:normal;font-size:16px;line-height:1}
.kbtn .n{font-family:"DM Mono",monospace;color:var(--ink3);font-weight:400}

/* ---------- grid diagnostik ---------- */
.diag{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;margin-top:13px;-webkit-overflow-scrolling:touch}
.diag table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.diag th,.diag td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.diag thead th{position:sticky;top:0;background:var(--surface2);z-index:2;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:center}
.diag .soal{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px;max-width:250px;white-space:normal;border-right:1px solid var(--line);line-height:1.35;text-align:left}
.diag thead .soal{z-index:3;background:var(--surface2)}
.diag tbody tr:last-child td{border-bottom:0}
.sel{width:24px;height:21px;border-radius:5px;display:block;margin:0 auto}
.sel.ok{background:var(--teal)}
.sel.no{background:var(--arteri)}
.sel.kosong{background:var(--line2);opacity:.45}
.diag .kira{font-family:"DM Mono",monospace;text-align:right;color:var(--ink2)}
.diag tr.bahaya .soal{box-shadow:inset 3px 0 0 0 var(--arteri)}
.diag tr.bahaya .kira{color:var(--arteri);font-weight:600}
.petunjuk{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:12.5px;color:var(--ink3);align-items:center}
.petunjuk span{display:inline-flex;align-items:center;gap:6px}
.petunjuk i{width:14px;height:14px;border-radius:4px;display:block}

/* ---------- tindih TP ---------- */
.tindih{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface2)}
.tindih label{font-size:13px;color:var(--ink2);font-weight:600}
.tindih select{font:inherit;font-size:15px;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);min-height:42px}
.cubtab{width:100%;border-collapse:collapse;font-size:13px;margin:0}
.cubtab th,.cubtab td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.cubtab th{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.cubtab td.n{font-family:"DM Mono",monospace;text-align:right}
.cubtab th.n{text-align:right}
.cubtab tr:last-child td{border-bottom:0}
.tandaT{color:var(--arteri);font-weight:700}

/* ---------- rentetan ---------- */
.api{display:inline-flex;align-items:center;gap:5px;font-family:"DM Mono",monospace;font-size:12.5px;font-weight:500}
.api em{font-style:normal;font-size:15px}

@media (max-width:560px){
  .figure{padding:9px}
  .brand span{display:none}
  .brand b{font-size:15px}
  .topbar-in{min-height:54px;gap:9px}
  .seg button{padding:9px 12px;font-size:12.5px}
  .icon-btn{width:44px;height:44px}
  .hud{top:54px}
  .panel-hd h2{font-size:20px}
  .panel-bd,.panel-hd{padding:15px}
  .qtext{font-size:17.5px}
  .result{padding:25px 15px}
  .result h2{font-size:22px}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .row .tpbar{grid-column:1;justify-self:start}
  .row .tpbig{grid-row:1;grid-column:2}
}
/* Telefon sempit: beri ruang kepada nama app supaya ia tidak dipotong,
   dan pada skrin paling sempit tinggalkan logo sahaja. */
@media (max-width:400px){
  .brand svg{display:none}
  .brand b{font-size:14.5px}
  .topbar-in{gap:6px}
  .seg button{padding:9px 10px;font-size:12px}
}
@media (max-width:344px){
  .brand svg{display:block}
  .brand b{display:none}
}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- tambahan: identiti bernombor, mod tenang, penanda bukan warna ---------- */
h3{font-family:"Bricolage Grotesque","Figtree",sans-serif;font-size:19px;margin:0 0 6px}

/* grid nombor murid */
.nomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:15px}
.nom{
  border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 8px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:70px;justify-content:center;
}
.nom:hover{border-color:var(--line2)}
.nom .n{font-family:"DM Mono",monospace;font-size:22px;font-weight:500;line-height:1}
.nom .s{font-size:11px;color:var(--ink3);line-height:1.2}

/* kotak kod */
input.pin{
  font-family:"DM Mono",monospace;font-size:24px;letter-spacing:.32em;width:150px;text-align:center;
  padding:11px 13px;border:1.5px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--ink);
}

/* mod tenang */
.tenangrow{
  display:flex;gap:13px;align-items:center;border:1.5px solid var(--line2);background:var(--surface2);
  border-radius:13px;padding:12px 14px;margin-top:15px;flex-wrap:wrap;
}
.tenangrow .txt{flex:1 1 200px;min-width:0}
.tenangrow .t{font-weight:700;font-size:14.5px}
.tenangrow .d{font-size:13px;color:var(--ink2);line-height:1.45}
.hud.tenang .nafasbar i{background:linear-gradient(90deg,#7B8EA8,#AABCD3)}
.hud.tenang .nafasbar{animation:none}
.nafasbar.baca i{background:linear-gradient(90deg,#8AA3CC,#C3D2E8)}
.nafasbar.baca{animation:none}
.qnote.baca{color:var(--vena);font-weight:600}

/* hentian menunggu pertimbangan cikgu */
.stop[data-s="tunggu"]{border-color:var(--amber)}
.stop[data-s="tunggu"] .dot{border-color:var(--amber);background:var(--amber);color:#fff}

/* soalan ulangan */
.chip-ulang{
  display:inline-block;font-size:12px;color:var(--amber);background:var(--amber-soft);
  border:1px solid var(--amber);border-radius:999px;padding:5px 11px;margin-top:12px;line-height:1.35;
}
.qnote.cukup{color:var(--teal)}
.pip.hantar{background:var(--amber)}

/* karangan murid dalam mod cikgu */
.karangan{
  padding:13px 15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;
  background:var(--surface2);border-bottom:1px solid var(--line);
}

/* penanda diagnostik: simbol, bukan warna sahaja */
.sel{
  width:24px;height:21px;border-radius:5px;display:grid;place-items:center;margin:0 auto;
  font-family:"DM Mono",monospace;font-size:12px;line-height:1;color:#fff;
}
.sel.kosong{background:var(--line2);opacity:.55;color:var(--ink2)}
.amaran{
  display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;
  background:var(--arteri);color:#fff;font-family:"DM Mono",monospace;font-size:11px;font-style:normal;
}
.petunjuk .sel{display:inline-grid;width:20px;height:18px;margin:0}

/* penunjuk talian: murid perlu tahu jawapannya sudah sampai atau belum */
.talian{
  font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.04em;padding:5px 9px;
  border-radius:999px;white-space:nowrap;flex:none;border:1px solid transparent;
}
.talian.ok{color:var(--teal);background:var(--teal-soft);border-color:var(--teal)}
.talian.tunggu{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.talian.luar{color:var(--ink3);background:var(--surface2);border-color:var(--line2)}
/* Pada telefon, lencana di bar atas tidak muat. Tanda "Tersimpan" tidak
   perlu dilihat, tetapi amaran jawapan tertunggak mesti dilihat, jadi ia
   dipaparkan sebagai jalur di atas soalan. */
@media (max-width:680px){ .talian{display:none} }
.talian-jalur{
  margin-top:12px;border-radius:11px;padding:9px 13px;font-size:13px;line-height:1.45;
  border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--ink);
}
.talian-jalur.luar{border-color:var(--line2);background:var(--surface2)}
@media (min-width:681px){ .talian-jalur{display:none !important} }

.qnote.gagal{color:var(--arteri);font-weight:600}

/* sasaran kad seterusnya */
.sasaran{
  display:flex;gap:13px;align-items:center;border:1.5px solid var(--line2);
  background:var(--surface2);border-radius:13px;padding:12px 14px;margin-top:15px;flex-wrap:wrap;
}
.sasaran .em{font-size:26px;line-height:1;flex:none;filter:grayscale(1);opacity:.55}
.sasaran .txt{flex:1 1 200px;min-width:0}
.sasaran .t{font-weight:700;font-size:14.5px}
.sasaran .d{font-size:13px;color:var(--ink2);line-height:1.45}
.sasaran.siap .em{filter:none;opacity:1}

/* apa yang murid belajar, dipaparkan selepas satu hentian */
.pelajaran{margin-top:20px;text-align:left;border-top:1px solid var(--line);padding-top:16px}
.pelajaran h3{font-size:15px;margin-bottom:9px}
.pelajaran ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.pelajaran li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.pelajaran .tanda{
  flex:none;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;margin-top:1px;
  font-family:"DM Mono",monospace;font-size:11px;color:#fff;
}
.pelajaran .tanda.ok{background:var(--teal)}
.pelajaran .tanda.no{background:var(--arteri)}
.pelajaran .tanda.hantar{background:var(--amber)}
.pelajaran b{color:var(--ink);font-weight:650;display:block;font-size:13.5px}
.pelajaran p{max-width:none;margin:12px 0 0;text-align:left}

/* baris ringkasan di skrin keputusan: cip pendek, bukan satu ayat panjang
   bercetak besar yang pecah tiga baris pada telefon */
.metahasil{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.metahasil span{
  font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink2);
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.result .note{max-width:40ch;margin:11px auto 0;font-size:12.5px}

/* papan mingguan */
.papantab{display:flex;gap:4px;margin-bottom:12px}
.papantab button{
  border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;
  padding:7px 14px;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--ink3);min-height:44px;
}
.papantab button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.prow .sub{font-size:11.5px;color:var(--ink3);font-family:"DM Mono",monospace}

/* pemilih bab pada peta murid */
.babrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:15px}
.babrow .tajuk{
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);width:100%;
}
.babbtn{
  flex:1 1 150px;min-width:0;text-align:left;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;
  display:flex;flex-direction:column;gap:2px;min-height:60px;justify-content:center;
}
.babbtn:hover{border-color:var(--line2)}
.babbtn[aria-pressed="true"]{border-color:var(--arteri);background:var(--surface)}
.babbtn .k{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3)}
.babbtn[aria-pressed="true"] .k{color:var(--arteri)}
.babbtn .n{font-weight:650;font-size:13.5px;line-height:1.25}
.babbtn .s{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--teal)}

/* ---------- masuk murid: kod kelas, nama, PIN ---------- */
.medan{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.medan label{font-size:13px;font-weight:650;color:var(--ink2)}
.medan input,.medan select{
  font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line2);border-radius:11px;
  background:var(--surface);color:var(--ink);width:100%;min-height:48px;
}
.medan input:focus{border-color:var(--vena);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--vena) 22%,transparent)}
input.kodkelas{
  font-family:"DM Mono",monospace;font-size:30px;letter-spacing:.22em;text-transform:uppercase;
  text-align:center;padding:14px 10px;border:2px solid var(--line2);border-radius:14px;
  background:var(--surface);color:var(--ink);width:100%;max-width:340px;
}
input.kodkelas:focus{border-color:var(--arteri);outline:none}
.sambut{text-align:center;padding-block:8px 4px}
.sambut .logo{width:64px;height:64px;margin:0 auto 12px;display:block}
.sambut h2{font-size:28px}
.sambut p{color:var(--ink2);margin-top:6px}
.tengah{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
.namalist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}
.namabtn{
  display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;min-height:56px;
  border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 12px;
  font-size:15px;font-weight:600;line-height:1.25;
}
.namabtn:hover{border-color:var(--vena);background:var(--surface)}
.namabtn .av{
  flex:none;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;color:#fff;
}
.cari{
  font:inherit;font-size:16px;width:100%;padding:11px 14px;margin-top:12px;
  border:1.5px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--ink);
}
.pinpapar{display:flex;gap:12px;justify-content:center;margin-top:18px}
.pinpapar i{
  width:52px;height:60px;border-radius:13px;border:2px solid var(--line2);background:var(--surface);
  display:grid;place-items:center;font-style:normal;font-family:"DM Mono",monospace;font-size:28px;
}
.pinpapar i.isi{border-color:var(--vena)}
.pinpapar i.isi::after{content:"";width:14px;height:14px;border-radius:999px;background:var(--vena)}
.pinpapar.salah i{border-color:var(--arteri);animation:goyang .35s}
@keyframes goyang{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:20px auto 0}
.pinpad button{
  min-height:62px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);
  font-family:"DM Mono",monospace;font-size:24px;cursor:pointer;
}
.pinpad button:active{background:var(--line)}
.pinpad button.aksi{font-family:inherit;font-size:15px;font-weight:650;color:var(--ink2)}

/* ---------- guru: log masuk dan papan pemuka ---------- */
.authkad{max-width:440px;margin:0 auto}
.urutannota{margin:10px 2px 0;text-align:center}
.demokad{max-width:440px;margin:0 auto 16px}
.demokad h3{margin:0 0 6px;font-size:20px;line-height:1.25}
.nilaisenarai{margin:12px 0 12px;padding-left:20px;display:grid;gap:6px}
.nilaisenarai li{font-size:14.5px;line-height:1.45;color:var(--ink2)}
.demojalur{margin-top:6px;padding:12px 16px;border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--surface2);display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.demojalur p{margin:0;flex:1 1 240px;font-size:14px;color:var(--ink2)}
.demojalur p.note{flex-basis:100%;font-size:12.5px}
.demojalur p.note a{color:var(--vena);font-weight:600}
.btn.google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line2);box-shadow:none;
}
.atau{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px;margin-top:16px}
.atau::before,.atau::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.penuh{width:100%}
.setuju{display:flex;gap:10px;align-items:flex-start;min-height:44px;margin-top:16px;font-size:14px;line-height:1.45;color:var(--ink2);cursor:pointer}
.setuju input{width:20px;height:20px;flex:none;margin-top:1px}
.setuju em{color:var(--ink3);font-style:normal}
.note.privasi{font-size:12px;margin-top:10px}
.pautan{background:none;border:0;padding:11px 0;color:var(--vena);font-weight:650;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.guruhd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.guruhd .grow{flex:1 1 220px;min-width:0}
.guruhd h2{font-size:26px}
.guruhd p{color:var(--ink3);font-size:14px;margin-top:3px}
.guruhd .butang{display:flex;gap:8px}
@media (max-width:560px){
  .guruhd h2{font-size:22px}
  .kadkelas.tambah{min-height:84px;flex-direction:row}
  .kodbesar{font-size:19px;padding:6px 11px}
}
input.kodkelas::placeholder{opacity:.3}
.kelasgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.kadkelas{
  text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 17px;display:flex;flex-direction:column;gap:10px;
  min-height:170px;transition:transform .12s,box-shadow .12s;
}
.kadkelas:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.kadkelas .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;line-height:1.1}
.kadkelas .kd{font-family:"DM Mono",monospace;font-size:13px;color:var(--ink3)}
.kadkelas .kd b{color:var(--arteri);font-weight:500;letter-spacing:.12em;font-size:15px}
.kadkelas .st{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:auto}
.kadkelas .st b{font-family:"DM Mono",monospace;font-size:17px;color:var(--ink);font-weight:500;display:block}
.agihan{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.agihan i{display:block;height:100%}
.kadkelas.tambah{
  border:2px dashed var(--line2);background:transparent;box-shadow:none;align-items:center;justify-content:center;
  color:var(--ink2);font-weight:650;text-align:center;
}
.kadkelas.tambah .plus{font-size:34px;line-height:1;color:var(--arteri)}
.kadkelas.contoh{border-style:dashed}
.kadkelas.import{border-style:solid;border-color:var(--vena);background:var(--surface)}
.kadkelas.tambah small{display:block;font-weight:500;color:var(--ink3);font-size:12.5px;margin-top:2px}
.langkah{margin:14px 0 0;padding-left:20px;color:var(--ink2);font-size:14.5px;line-height:1.7}
.kembali{border:0;background:none;cursor:pointer;color:var(--ink2);font-weight:650;font-size:14px;padding:11px 0;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.kodbesar{
  font-family:"DM Mono",monospace;font-size:26px;letter-spacing:.2em;color:var(--arteri);
  background:var(--arteri-soft);border-radius:12px;padding:8px 14px;white-space:nowrap;
}
.kongsi{border:1.5px solid var(--line);border-radius:13px;padding:14px 15px;margin-top:4px;background:var(--surface2)}
.kongsi .t{font-weight:700;font-size:15px}
.kongsi .url{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--ink2);word-break:break-all;margin-top:6px}
.muridtab{width:100%;border-collapse:collapse;font-size:14px}
.muridtab th,.muridtab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.muridtab th{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.muridtab input{font:inherit;font-size:15px;width:100%;min-width:150px;padding:11px 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);min-height:44px}
.muridtab input:hover,.muridtab input:focus{border-color:var(--line2);background:var(--surface)}
.muridtab .pinsel{font-family:"DM Mono",monospace;font-size:16px;letter-spacing:.14em}
.muridtab .ops{white-space:nowrap;text-align:right}
/* 44px walaupun butang ini kecil: "Buang" memadam nama murid, jadi salah
   ketik di sini mahal. */
.btnkecil{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink2);min-height:44px}
.btnkecil.bahaya{color:var(--arteri)}
a.btnkecil{display:inline-flex;align-items:center;text-decoration:none}
/* Kotak semak 18px terlalu kecil untuk jari, tetapi labelnya boleh diketik
   juga, jadi sasaran sebenar ialah label ini. */
.suis{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer;min-height:44px}
.suis input[type=checkbox]{width:22px;height:22px;flex:none}
.papanbesar .prow{font-size:16px;padding:11px 4px}
.papanbesar .prow .rk{font-size:15px}
.pingat{font-size:18px}
/* ============================================================
   ZON MURID — "pengembaraan dalam badan"
   Setiap bab ialah satu dunia berwarna. Butang pelekat tebal ialah
   satu-satunya unsur berani; yang lain kekal tenang.
   ============================================================ */
body.zon-murid{
  --ground:#F4F2FB;
  --tinta:#1C1B3A; --kad:#FFFFFF; --kad2:#EEEBFA; --garis:#1C1B3A;
  --lulus:#1DB36B; --lulus-lembut:#DDF6E8; --silap:#F2545B; --silap-lembut:#FDE4E5;
  --emas:#FFC83D; --lembut:#6B6890;
  --dunia:#6D3BFF; --dunia-lembut:#ECE5FF; --dunia-gelap:#4B22C9;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body.zon-murid{
    --ground:#15142C; --tinta:#F1EFFF; --kad:#221F42; --kad2:#2C2952; --garis:#07061A;
    --lulus-lembut:#113A28; --silap-lembut:#3E1A22; --lembut:#A9A6CF; --dunia-lembut:#2A2256;
  }
}
:root[data-theme="dark"] body.zon-murid{
  --ground:#15142C; --tinta:#F1EFFF; --kad:#221F42; --kad2:#2C2952; --garis:#07061A;
  --lulus-lembut:#113A28; --silap-lembut:#3E1A22; --lembut:#A9A6CF; --dunia-lembut:#2A2256;
}
body.zon-murid{color:var(--tinta)}
#murid h1,#murid h2,#murid h3,.bulat{font-family:"Baloo 2","Figtree",sans-serif;letter-spacing:-.01em;line-height:1.08}
#murid .panel{
  background:var(--kad);border:2px solid var(--garis);border-radius:22px;
  box-shadow:0 5px 0 var(--garis);
}
#murid .panel-hd{border-bottom:2px dashed color-mix(in srgb,var(--tinta) 18%,transparent)}
#murid .panel-hd h2{font-size:27px;font-weight:800}
#murid .eyebrow{font-family:"Figtree",sans-serif;text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--dunia)}
#murid .qnote,#murid .note{color:var(--lembut)}
#murid .btn{
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;letter-spacing:.01em;
  background:var(--dunia);color:#fff;border:2px solid var(--garis);border-radius:16px;
  box-shadow:0 4px 0 var(--garis);min-height:52px;padding:10px 22px;
  transition:transform .06s,box-shadow .06s;
}
#murid .btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--garis)}
#murid .btn.ghost{background:var(--kad);color:var(--tinta)}
#murid .btn.teal,#murid .btn.hijau{background:var(--lulus)}
#murid .btn.sm{font-size:15px;min-height:44px;padding:7px 15px;border-radius:13px;box-shadow:0 3px 0 var(--garis)}
#murid .btn:disabled{opacity:.45;box-shadow:0 4px 0 var(--garis)}
#murid .pautan{color:var(--dunia)}

/* bar permainan */
#murid .hud{
  background:var(--kad);color:var(--tinta);border:2px solid var(--garis);border-radius:20px;
  box-shadow:0 4px 0 var(--garis);grid-template-columns:auto 1fr auto auto;gap:12px;padding:10px 14px;
}
#murid .hud .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#murid .hud .ikonhud{font-size:24px;line-height:1}
#murid .hud .val{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px}
#murid .nafasbar{height:16px;background:var(--kad2);border:2px solid var(--garis);margin-top:0}
#murid .nafasbar i{background:linear-gradient(90deg,#3FD39A,#1DB36B)}
#murid .nafasbar.lemas i{background:linear-gradient(90deg,#FF8A5B,#F2545B)}
#murid .hud .kombo{display:flex;align-items:center;gap:3px;background:var(--emas);color:#3B2A00;border:2px solid var(--garis);border-radius:999px;padding:0 10px}
#murid .hud .kombo .val{color:#3B2A00;font-size:18px}
#murid .hud .skor{display:flex;align-items:center;gap:4px;border:0;padding:0}
#murid .hud .skor .val{font-size:22px}
#murid .hud.tenang .nafasbar i{background:linear-gradient(90deg,#A9A6CF,#CFCDEA)}
#murid .nafasbar.baca i{background:linear-gradient(90deg,#8FB8FF,#C3D8FF)}
@media (max-width:560px){
  #murid .hud{grid-template-columns:auto 1fr auto auto;gap:8px;padding:9px 11px}
  #murid .hud .kombo{grid-row:auto;grid-column:auto}
  #murid .hud .skor{grid-column:auto;border:0;padding:0}
  #murid .hud .skor .val,#murid .hud .val{font-size:18px}
}

/* soalan */
#murid .qtext{font-size:20px;font-weight:700;line-height:1.38}
#murid .opt{
  border:2px solid var(--garis);background:var(--kad);border-radius:16px;min-height:56px;
  box-shadow:0 3px 0 var(--garis);font-size:16px;padding:12px 14px;align-items:center;
  transition:transform .06s,box-shadow .06s,background .1s;
}
#murid .opt:hover:not(:disabled){background:var(--dunia-lembut);border-color:var(--garis)}
#murid .opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--garis)}
#murid .opt .key{width:30px;height:30px;border-radius:9px;border:2px solid var(--garis);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15px;color:var(--tinta);margin-top:0;background:var(--kad2)}
#murid .opt .ord{width:30px;height:30px;background:var(--dunia);font-family:"Baloo 2",sans-serif;font-size:15px;margin-top:0}
#murid .opt[data-pick="1"]{background:var(--dunia-lembut);border-color:var(--garis)}
#murid .opt[data-pick="1"] .key{background:var(--dunia);color:#fff;border-color:var(--garis)}
#murid .opt[data-mark="ok"]{background:var(--lulus-lembut)}
#murid .opt[data-mark="ok"] .key{background:var(--lulus);color:#fff}
#murid .opt[data-mark="no"]{background:var(--silap-lembut)}
#murid .opt[data-mark="no"] .key{background:var(--silap);color:#fff}
#murid .opt[data-mark="miss"]{border-style:dashed;border-color:var(--lulus)}
#murid .opt:disabled{box-shadow:0 3px 0 var(--garis)}
#murid .pips{gap:6px;flex:1}
#murid .pip{flex:1 1 0;min-width:0;max-width:none;height:12px;border-radius:999px;background:var(--kad2);border:2px solid var(--garis)}
#murid .pip.on{background:var(--dunia)}
#murid .pip.ok{background:var(--lulus)}
#murid .pip.no{background:var(--silap)}
#murid .pip.hantar{background:var(--emas)}
#murid .fb{border:2px solid var(--garis);border-radius:18px;box-shadow:0 4px 0 var(--garis);display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
#murid .fb .emo{font-size:36px;line-height:1;flex:none}
#murid .fb b{font-family:"Baloo 2",sans-serif;font-size:22px;font-weight:800;margin-bottom:1px}
#murid .fb.ok{background:var(--lulus-lembut)}
#murid .fb.no{background:var(--silap-lembut)}
#murid .bospanel{border-color:var(--garis);box-shadow:0 5px 0 var(--garis),0 0 0 5px color-mix(in srgb,var(--silap) 35%,transparent)}
#murid .bostimer{height:12px;border:2px solid var(--garis);background:var(--kad2)}
#murid .bostimer i{background:var(--silap)}
#murid .tajukbos{display:inline-flex;align-items:center;gap:8px}
#murid .kbtn{border:2px solid var(--garis);background:var(--kad);box-shadow:0 3px 0 var(--garis)}
#murid .kuasa .tajuk{font-family:"Figtree",sans-serif;text-transform:none;letter-spacing:0;font-size:13px;font-weight:700}
#murid .chip-ulang{border:2px solid var(--garis);color:var(--tinta);background:var(--emas)}
#murid textarea.free,#murid .numrow input{border:2px solid var(--garis);background:var(--kad);color:var(--tinta)}

/* peta dunia */
.wira{
  position:relative;overflow:hidden;margin-top:16px;border:2px solid var(--garis);border-radius:24px;
  background:var(--dunia);color:#fff;box-shadow:0 5px 0 var(--garis);padding:20px 20px 18px;
}
.wira::after{
  content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,#fff 22%,transparent) 0 38%,transparent 39% 55%,color-mix(in srgb,#fff 12%,transparent) 56% 70%,transparent 71%);
  pointer-events:none;
}
.wira .ikonbesar{position:absolute;right:18px;top:14px;font-size:54px;line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.bebas .medan-bebas{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;text-align:left;font-weight:700;font-size:15px}
.bebas .medan-bebas small{font-weight:500;opacity:.7}
.bebas .medan-bebas input{font:600 18px/1.3 "Figtree",sans-serif;padding:13px 15px;border:2.5px solid var(--garis,#1C1B3A);border-radius:14px;background:var(--kad,#fff);color:var(--tinta,#1C1B3A);width:100%}
.bebas .medan-bebas input:focus{outline:3px solid var(--dunia,#6D3BFF);outline-offset:1px}
.bebas .tengah{gap:14px}
.ucap-nama{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:20px;margin:-4px 0 8px}
.wira .siapa{font-weight:700;font-size:14px;opacity:.92;padding-right:70px}
.wira h2{font-family:"Baloo 2",sans-serif;font-size:38px;font-weight:800;line-height:1;margin-top:4px;padding-right:60px}
.wira .cerita{margin-top:6px;font-size:15px;opacity:.95;max-width:34ch}
.wira .statbaris{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wira .stat{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
  border:2px solid rgba(0,0,0,.25);border-radius:999px;padding:4px 12px 4px 8px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:16px;
}
.wira .kemajuan{display:flex;gap:6px;margin-top:14px}
.wira .kemajuan i{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.25);border:2px solid rgba(0,0,0,.25)}
.wira .kemajuan i.on{background:var(--emas)}
.wira .latihan{display:inline-block;margin-top:10px;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700}

/* Jalur bab kekal menatal kerana sepuluh bab tidak muat berbalut pada peta,
   tetapi ia mesti mengaku yang ia menatal. Bungkusnya memaparkan lorek
   pudar dan anak panah pada mana-mana tepi yang masih ada bab tersembunyi.
   Bayang latar CSS sahaja pernah dicuba dan terlalu halus dalam tema gelap. */
.jalurbungkus{position:relative}
.jalurbungkus::before,.jalurbungkus::after{content:"";position:absolute;top:0;bottom:6px;width:44px;pointer-events:none;opacity:0;transition:opacity .15s}
.jalurbungkus::before{left:0;background:linear-gradient(to right,var(--ground) 32%,rgba(0,0,0,0))}
.jalurbungkus::after{right:0;background:linear-gradient(to left,var(--ground) 32%,rgba(0,0,0,0))}
.jalurbungkus[data-kiri="1"]::before,.jalurbungkus[data-kanan="1"]::after{opacity:1}
.jalurbungkus .anak{position:absolute;top:50%;transform:translateY(-58%);z-index:2;pointer-events:none;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;line-height:1;color:var(--tinta);opacity:0;transition:opacity .15s}
.jalurbungkus .anak.kiri{left:3px}
.jalurbungkus .anak.kanan{right:3px}
.jalurbungkus[data-kiri="1"] .anak.kiri,.jalurbungkus[data-kanan="1"] .anak.kanan{opacity:.9}
.babpilih{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.babpilih::-webkit-scrollbar{display:none}
.tingpilih{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
/* 44px: chip tingkatan ialah navigasi utama peta, bukan hiasan. */
.tingpilih button{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid var(--garis,var(--line2));background:transparent;color:inherit;cursor:pointer;min-height:44px}
.tingpilih button[aria-pressed="true"]{background:var(--dunia,var(--vena));border-color:var(--dunia,var(--vena));color:#fff}
.babpilih button.akan-datang{opacity:.55;cursor:default;border-style:dashed}
.babpilih button.terkunci,.kbtn.terkunci{opacity:.55;cursor:pointer;border-style:dashed}
.akan-datang-guru{align-self:center;margin:0}
.kadpremium{border:2px solid var(--gen);background:var(--gen-soft)}
.kadpremium h3{margin:0 0 4px}
.kadpremium .status{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;margin-top:2px}
.kadpremium .status.aktif{color:var(--teal)}
.baris-premium{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px;border-top:1px solid var(--line)}
.baris-premium:first-of-type{border-top:none}
.mb-skor{display:flex;gap:8px;margin-top:8px}
.mb-skor .kbtn{min-width:48px;min-height:48px;justify-content:center;font-weight:700}
.mb-skor .kbtn[aria-pressed="true"]{background:var(--vena);color:#fff;border-color:var(--vena)}
.mb-hujung{margin-top:6px;font-size:12.5px}
.mb-ting{display:flex;flex-wrap:wrap;gap:4px 18px}
.mb-ting .setuju{margin-top:4px}
.mb-ting .setuju input{width:20px;height:20px;min-height:0;padding:0;margin-top:0}
.mb-ting .setuju{align-items:center;font-size:15px;font-weight:600}
.maklumbalas textarea.free{min-height:96px;margin-top:0}
.mb-ok{color:var(--teal);font-weight:650}
.babpilih button{
  flex:none;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;
  border:2px solid var(--garis);background:var(--kad);color:var(--tinta);border-radius:999px;
  padding:6px 14px 6px 8px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:15px;
  box-shadow:0 3px 0 var(--garis);min-height:44px;
}
.babpilih button[aria-pressed="true"]{background:var(--tinta);color:var(--kad)}
.babpilih .ik{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2px solid var(--garis)}

.laluan{position:relative;margin:44px auto 10px;max-width:560px}
.laluan svg.jalan{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.laluan .jalan path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hentian{position:relative;height:118px;display:flex;align-items:center}
.nod{
  position:absolute;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;
  border:3px solid var(--garis);background:var(--kad);box-shadow:0 6px 0 var(--garis);
  display:grid;place-items:center;font-size:36px;line-height:1;cursor:pointer;
  transition:transform .08s,box-shadow .08s;
}
.nod:active{transform:translateY(5px);box-shadow:0 1px 0 var(--garis)}
.nod .lencana{
  position:absolute;right:-6px;bottom:-4px;min-width:30px;height:30px;border-radius:999px;
  border:2px solid var(--garis);background:var(--kad);display:grid;place-items:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15px;color:var(--tinta);padding:0 5px;
}
.nod[data-s="lulus"]{background:var(--lulus)}
.nod[data-s="lulus"] .lencana{background:var(--emas);color:#3B2A00}
.nod[data-s="aktif"]{background:var(--dunia);width:92px;height:92px;margin:-46px 0 0 -46px;font-size:42px}
.nod[data-s="aktif"]::before{
  content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--dunia);
  animation:gelombang 1.8s ease-out infinite;
}
@keyframes gelombang{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.nod[data-s="tunggu"]{background:var(--emas)}
.nod[data-s="buka"]{filter:saturate(.35)}
.nod[data-s="buka"]:hover{filter:none}
.labelnod{position:absolute;top:50%;transform:translateY(-50%);max-width:44%;line-height:1.15}
.labelnod b{display:block;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:18px}
.labelnod span{font-size:12.5px;color:var(--lembut);font-weight:600}
.gelembung{
  position:absolute;left:50%;top:-38px;transform:translateX(-50%);white-space:nowrap;
  background:var(--tinta);color:var(--kad);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15px;
  border-radius:12px;padding:3px 12px;animation:lompat 1.2s ease-in-out infinite;
}
.gelembung::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--tinta)}
@keyframes lompat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

.kotakmain{
  display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:14px;
  border:2px solid var(--garis);border-radius:20px;background:var(--kad);box-shadow:0 4px 0 var(--garis);padding:13px 15px;
}
.kotakmain .em{font-size:34px;line-height:1;flex:none}
.kotakmain .txt{flex:1 1 180px;min-width:0}
.kotakmain .t{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:18px;line-height:1.15}
.kotakmain .d{font-size:13.5px;color:var(--lembut)}
.kotakmain.harian{background:#FFF1C9;color:#2B2200}
.kotakmain.harian .d{color:#5E4E1C}
.kotakmain.pasang .tutup{background:none;border:0;color:var(--lembut);font-size:13.5px;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.kotakmain.pasang .langkah{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--lembut)}
.alat{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.suisbesar{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;border:2px solid var(--garis);
  background:var(--kad);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:14px;
  box-shadow:0 3px 0 var(--garis);min-height:44px;color:var(--tinta);
}
.suisbesar .trek{width:40px;height:24px;border-radius:999px;background:var(--kad2);border:2px solid var(--garis);position:relative;flex:none}
.suisbesar .trek::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--tinta);transition:left .15s}
.suisbesar[aria-pressed="true"] .trek{background:var(--lulus)}
.suisbesar[aria-pressed="true"] .trek::after{left:18px;background:#fff}

#murid .papan .prow{border-bottom:2px dashed color-mix(in srgb,var(--tinta) 14%,transparent);font-size:16px}
#murid .prow.saya{background:var(--dunia-lembut);border-radius:12px;padding-inline:8px}
#murid .prow .sk{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px}
#murid .prow .sub{font-family:"Figtree",sans-serif}
#murid .papantab button{border:2px solid var(--garis);background:var(--kad);color:var(--tinta);font-weight:700}
#murid .papantab button[aria-pressed="true"]{background:var(--tinta);color:var(--kad)}

/* keputusan */
#murid .result h2{font-size:32px;font-weight:800}
.bintang{display:flex;justify-content:center;gap:6px;margin:4px 0 12px}
.bintang span{font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 var(--garis));opacity:.2;transform:scale(.6)}
.bintang span.on{opacity:1;transform:scale(1);animation:bintangmasuk .45s cubic-bezier(.3,1.6,.5,1) both}
.bintang span:nth-child(2){transform:translateY(-10px) scale(.6);font-size:64px}
.bintang span.on:nth-child(2){transform:translateY(-10px);animation-delay:.18s}
.bintang span.on:nth-child(3){animation-delay:.36s}
@keyframes bintangmasuk{0%{opacity:0;transform:scale(.2) rotate(-40deg)}100%{opacity:1}}
.skorbesar{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:44px;line-height:1;color:var(--dunia);margin-top:4px}
#murid .metahasil span{font-family:"Figtree",sans-serif;font-weight:700;border:2px solid var(--garis);background:var(--kad2);color:var(--tinta)}
#murid .kadbesar{border:3px solid var(--garis);box-shadow:0 6px 0 var(--garis);background:linear-gradient(160deg,var(--dunia),var(--dunia-gelap));transform:rotate(-3deg)}
#murid .kad{border:2px solid var(--garis);box-shadow:0 4px 0 var(--garis);background:linear-gradient(160deg,var(--dunia),var(--dunia-gelap))}
#murid .kad.kunci{background:var(--kad2);color:var(--lembut);border-style:dashed;box-shadow:none}
#murid .badbig{border:3px solid var(--garis);background:var(--kad2);box-shadow:0 5px 0 var(--garis)}
#murid .pelajaran{border-top:2px dashed color-mix(in srgb,var(--tinta) 18%,transparent)}
#murid .pelajaran .tanda{border:2px solid var(--garis);width:22px;height:22px}
#murid .pelajaran .tanda.ok{background:var(--lulus)}
#murid .pelajaran .tanda.no{background:var(--silap)}
.konfeti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.konfeti i{position:absolute;top:-20px;width:10px;height:16px;border:1.5px solid rgba(0,0,0,.35);border-radius:3px;animation:jatuh 1.9s cubic-bezier(.25,.6,.5,1) forwards}
@keyframes jatuh{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}

/* masuk */
#murid .namabtn{border:2px solid var(--garis);background:var(--kad);box-shadow:0 3px 0 var(--garis);border-radius:16px}
#murid .namabtn .av{border:2px solid var(--garis)}
#murid .pinpad button{border:2px solid var(--garis);background:var(--kad);box-shadow:0 4px 0 var(--garis);font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--tinta)}
#murid .pinpad button:active{transform:translateY(4px);box-shadow:none}
#murid .pinpad button.aksi{font-family:"Figtree",sans-serif;font-size:14px}
#murid .pinpapar i{border:2px solid var(--garis);background:var(--kad)}
#murid .pinpapar i.isi{background:var(--dunia-lembut)}
#murid .pinpapar i.isi::after{background:var(--dunia)}
#murid input.kodkelas,#murid .cari{border:2px solid var(--garis);background:var(--kad);color:var(--tinta);box-shadow:inset 0 3px 0 color-mix(in srgb,var(--tinta) 10%,transparent)}
#murid .sambut h2{font-size:34px;font-weight:800}
#murid .ralat{color:var(--silap)}
#murid .talian-jalur{border:2px solid var(--garis)}

.ralat{color:var(--arteri);font-weight:600;font-size:14px;margin-top:10px}
.berjaya{color:var(--teal);font-weight:600;font-size:14px;margin-top:10px}

/* Kocok kedudukan pilihan sekali semasa mula.
   Bagi soalan satu jawapan, kedudukan jawapan betul diagihkan secara
   BERLAPIS, bukan rawak semata: dalam satu hentian, setiap kedudukan
   dipakai hampir sama banyak, kemudian urutan agihan itu sendiri dikocok.
   Kocokan rawak tulen boleh menghasilkan empat soalan berturut-turut yang
   jawapannya sama-sama A, dan murid cepat perasan corak begitu. */
function kocokSemua(){
  ARAS.forEach(function(a){
    a.soalan.forEach(function(q,i){
      q._lam=a.lampiran||null; q.id="a"+a.n+"q"+(i+1); q.tp=a.n; q.sk=a.sk;
      q.label=ringkas(q.t);
    });
    if(a.bos){ a.bos._lam=a.lampiran||null; a.bos.id="a"+a.n+"bos"; a.bos.tp=a.n; a.bos.sk=a.sk; a.bos.label="BOS · "+ringkas(a.bos.t); }
  });
  ARAS.forEach(function(a){
    var semua=a.soalan.concat([a.bos]).filter(Boolean);
    var ikutBil={};
    semua.forEach(function(q){
      if(q.j!=="pilih") return;
      (ikutBil[q.p.length]=ikutBil[q.p.length]||[]).push(q);
    });
    Object.keys(ikutBil).forEach(function(bil){
      var n=Number(bil), senarai=ikutBil[bil], sasaran=[], mula=rnd(n);
      for(var i=0;i<senarai.length;i++) sasaran.push((mula+i)%n);
      for(var k=sasaran.length-1;k>0;k--){ var j=rnd(k+1),t=sasaran[k];sasaran[k]=sasaran[j];sasaran[j]=t; }
      senarai.forEach(function(q,idx){ letakJawapan(q,sasaran[idx]); });
    });
    semua.forEach(function(q){
      if(q.j==="banyak"||q.j==="susun") kocokBiasa(q);
    });
  });
}
/* Pindahkan jawapan betul ke kedudukan yang ditetapkan, pengganggu dikocok. */
function letakJawapan(q,sasaran){
  var betul=q.p[q.b];
  var lain=q.p.filter(function(_,i){ return i!==q.b; });
  for(var k=lain.length-1;k>0;k--){ var j=rnd(k+1),t=lain[k];lain[k]=lain[j];lain[j]=t; }
  var baru=[],c=0;
  for(var i=0;i<q.p.length;i++) baru.push(i===sasaran?betul:lain[c++]);
  q.p=baru; q.b=sasaran;
}
/* Soalan pelbagai jawapan dan soalan susunan tiada satu kedudukan betul,
   jadi ia dikocok biasa, cuma dielakkan daripada kekal pada susunan asal. */
function kocokBiasa(q){
  var n=q.p.length,idx,cuba=0,ident;
  do{
    idx=[];for(var i=0;i<n;i++)idx.push(i);
    for(var k=n-1;k>0;k--){var j=rnd(k+1),t=idx[k];idx[k]=idx[j];idx[j]=t;}
    ident=true;for(var m=0;m<n;m++)if(idx[m]!==m)ident=false;
    cuba++;
  }while(ident&&cuba<12);
  var peta={};idx.forEach(function(l,b){peta[l]=b;});
  q.b=q.b.map(function(l){return peta[l];});
  var pl=q.p;q.p=idx.map(function(l){return pl[l];});
}

function nada(f,dur,jenis,vol){

  try{
    var o=c.createOscillator(),g=c.createGain();
    o.type=jenis||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.10,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);
  }catch(e){}
}

function binaSet(n){
  var a=ARAS[n-1];
  var jum=Math.min(SOALAN_SET,a.soalan.length);
  var pilih=ambilRawak(a.soalan,jum);
  pilih.forEach(function(q){ q._ulang=false; });
  /* Ulangan pintar: satu soalan yang pernah salah dari hentian terdahulu.
     Ia latihan sahaja — tidak dikira dalam keputusan hentian ini dan
     tidak direkod sebagai bukti hentian ini. */
  if(S.salah.length && n>1 && Math.random()<0.8){
    var s=S.salah[rnd(S.salah.length)];
    if(s && s.aras<n){ s.q._ulang=true; pilih.splice(rnd(pilih.length),0,s.q); }
  }
  a.bos._ulang=false;
  pilih.push(a.bos);
  return pilih;
}
function mulaAras(n){
  S.aras=n; S.set=binaSet(n); S.qi=0;
  S.nafas=NAFAS_MAX; S.kombo=0; S.skor=0; S.mati=false; S.modHarian=false;
  S.betulBiasa=0; S.bosBetul=false; S.bosHantar=false;
  S.jumlahBiasa=S.set.filter(function(q){ return !q._ulang && q!==ARAS[n-1].bos; }).length;
  reset(); S.skrin="main"; render(); mulaJam();
  window.scrollTo({top:0,behavior:"smooth"});
}
function mulaHarian(){
  var semua=[];
  ARAS.forEach(function(a){ a.soalan.forEach(function(q){ if(q.j!=="buka"){ q._ulang=false; semua.push(q); } }); });
  S.set=ambilRawak(semua,5); S.qi=0;
  S.nafas=NAFAS_MAX; S.kombo=0; S.skor=0; S.mati=false; S.modHarian=true;
  S.betulBiasa=0; S.jumlahBiasa=S.set.length; S.bosBetul=false; S.bosHantar=false;
  reset(); S.skrin="main"; render(); mulaJam();
  window.scrollTo({top:0,behavior:"smooth"});
}
/* Masa membaca yang adil.
   Meter nafas tidak berkurang sehingga murid sempat membaca soalan,
   pilihan dan lampirannya, pada kira-kira dua setengah perkataan sesaat.
   Tanpa ini, soalan analisis yang ada jadual menghukum murid yang membaca
   dengan teliti, dan meter itu mengukur kelajuan membaca, bukan sains. */
/* Rajah hanya dipaparkan bersama soalan yang menyebut "Rajah". Dahulu ia
   melekat pada setiap soalan dalam hentian: 839 daripada 999 soalan berajah
   memaparkan rajah yang tiada kena-mengena (soalan iris mata bersama rajah
   neuron). Jadual kekal pada setiap soalan hentian kerana soalan analisis
   merujuknya. Peraturan yang sama ada dalam semak.html. */
function lampiranUntuk(q,lam){
  if(!lam||lam.indexOf("<figure")<0) return lam;
  var teks=[q.t,q.arahan].concat(q.p||[]).join(" ");
  return /\brajah\b/i.test(teks) ? lam : "";
}
function bilPerkataan(teks){
  return String(teks||"").replace(/<[^>]*>/g," ").replace(/&[a-z#0-9]+;/gi," ")
    .split(/\s+/).filter(Boolean).length;
}
function masaBaca(q){
  if(!q) return 0;
  var n=bilPerkataan(q.t)+bilPerkataan(q.arahan);
  (q.p||[]).forEach(function(x){ n+=bilPerkataan(x); });
  var a=ARAS[S.aras-1];
  n+=bilPerkataan(lampiranUntuk(q, S.modHarian ? q._lam : (a&&a.lampiran)));
  return Math.max(6, Math.min(45, Math.round(n/2.5)));
}
function reset(){
  S.retry=false; S.retryOk=undefined;
  S.pilihan=null; S.disemak=false; S.masaBos=0; S.masaBosPenuh=0; S.buang=[];
  S.tenggangPenuh=masaBaca(S.set[S.qi]); S.tenggang=S.tenggangPenuh;
}

function adaJawapan(q){
  if(q.j==="pilih")return S.pilihan!==null&&S.pilihan>=0;
  if(q.j==="banyak"||q.j==="susun")return S.pilihan&&S.pilihan.length>0;
  if(q.j==="nombor")return S.pilihan!==null&&S.pilihan!=="";
  if(q.j==="buka")return S.pilihan&&S.pilihan.trim().length>=MIN_HANTAR;
  return false;
}

function semak(masaHabis){
  var q=S.set[S.qi];
  var bos=(q===ARAS[S.aras-1].bos)&&!S.modHarian;

  /* Tugasan reka cipta tidak pernah dinilai oleh mesin.
     Panjang teks bukan ukuran mereka cipta — ia dihantar kepada guru. */
  if(q.j==="buka"){
    q._betul=null; q._hantar=true; S.bosHantar=true; S.disemak=true;
    S.nafas=Math.min(NAFAS_MAX,S.nafas+GANJARAN);
    S.karangan=S.pilihan;
    bunyi("kad"); aturDegup(); render();
    return;
  }

  /* Cuba lagi: latihan sahaja. Percubaan pertama sudah direkod dan tidak diubah. */
  if(S.retry){
    var b2=false;
    if(q.j==="pilih")b2=S.pilihan===q.b;
    else if(q.j==="banyak")b2=eqSet(S.pilihan,q.b);
    else if(q.j==="susun")b2=eq(S.pilihan,q.b);
    else if(q.j==="nombor")b2=Math.abs(parseFloat(S.pilihan)-q.b)<=(q.tol||0.05);
    S.retryOk=b2; S.disemak=true; bunyi(b2?"betul":"salah"); render();
    return;
  }

  var betul=false;
  if(!masaHabis){
    if(q.j==="pilih")betul=S.pilihan===q.b;
    else if(q.j==="banyak")betul=eqSet(S.pilihan,q.b);
    else if(q.j==="susun")betul=eq(S.pilihan,q.b);
    else if(q.j==="nombor")betul=Math.abs(parseFloat(S.pilihan)-q.b)<=(q.tol||0.05);
  }
  q._betul=betul; S.disemak=true;

  var skorLama=S.skor, kuasaBaru=null;

  if(betul){
    if(bos) S.bosBetul=true;
    else if(!q._ulang) S.betulBiasa++;
    S.kombo++;
    S.skor += (bos?300:100)*ganda();
    S.nafas=Math.min(NAFAS_MAX,S.nafas+GANJARAN);
    bunyi("betul");
    S.salah=S.salah.filter(function(x){return x.q!==q;});
    if(S.kombo%3===0){
      if(S.tenang||S.kombo%6===0){ if(S.hemo<3){S.hemo++;kuasaBaru="hemo";} }
      else { if(S.inhaler<3){S.inhaler++;kuasaBaru="inhaler";} }
    }
  } else {
    S.kombo=0;
    if(!S.tenang) S.nafas=Math.max(0,S.nafas-DENDA);
    bunyi("salah");
    if(!S.modHarian && !S.salah.some(function(x){return x.q===q;})) S.salah.push({aras:S.aras,q:q});
  }
  aturDegup(); render();

  kilat(betul?"ok":"no");
  var bar=$("bar"), skorEl=$("vSkor");
  if(betul){
    apung("+"+GANJARAN+" tenaga",warnaTok("--teal","#0E8C7F"),bar);
    bergolek(skorLama,S.skor);
    setTimeout(function(){ apung("+"+(S.skor-skorLama),"#FFD48A",skorEl); },120);
    if(ganda()>1) denyut($("vKombo"));
  } else if(!S.tenang){
    apung("−"+DENDA+" tenaga",warnaTok("--arteri","#C8102E"),bar);
  }
  if(kuasaBaru){
    setTimeout(function(){
      bunyi("kad");
      var kb=$(kuasaBaru==="hemo"?"btnHemo":"btnInhaler");
      denyut(kb);
      apung(kuasaBaru==="hemo"?"Petunjuk!":"Tenaga segar!",warnaTok("--teal","#0E8C7F"),kb||bar);
    },260);
  }
  if(!S.tenang && S.nafas<=0) setTimeout(pengsan,700);
}

function gunaInhaler(){
  if(S.inhaler<1||S.disemak)return;
  S.inhaler--;
  var sebelum=S.nafas;
  S.nafas=Math.min(NAFAS_MAX,S.nafas+40);

  apung("+"+Math.round(S.nafas-sebelum)+" nafas",warnaTok("--teal","#0E8C7F"),$("bar"));

function gunaHemo(){
  var q=S.set[S.qi];
  if(S.hemo<1||S.disemak)return;
  if(q.j!=="pilih"&&q.j!=="banyak")return;
  var salahIdx=[];
  q.p.forEach(function(_,i){
    var bt = q.j==="banyak" ? q.b.indexOf(i)>=0 : q.b===i;
    if(!bt && S.buang.indexOf(i)<0) salahIdx.push(i);
  });
  if(salahIdx.length<1)return;
  S.hemo--;
  S.buang=S.buang.concat(ambilRawak(salahIdx,Math.min(2,salahIdx.length)));
  if(S.pilihan!==null){
    if(q.j==="banyak") S.pilihan=S.pilihan.filter(function(i){return S.buang.indexOf(i)<0;});
    else if(S.buang.indexOf(S.pilihan)>=0) S.pilihan=-1;
  }
  bunyi("betul"); render();
}

/* Mod main bebas ditanda dalam URL, bukan dalam telefon sahaja: buka semula
   pautan ?main dan mod bebas kembali, buka pautan biasa dan skrin kod kelas

function tandaMainUrl(ada){
  try{
    var u=new URL(location.href);
    if(ada===u.searchParams.has("main")) return;
    if(ada) u.searchParams.set("main","1"); else u.searchParams.delete("main");
    history.replaceState(null,"",u.pathname+u.search+u.hash);
  }catch(e){}
}

   Dulu ia disimpan sebagai "cn-mod" dalam localStorage, jadi sekali sesiapa
   menekan butang Cikgu pada satu peranti, pautan biasa membuka borang log
   masuk guru pada peranti itu buat selama-lamanya. Murid yang meminjam
   telefon atau komputer bilik darjah itu terus berdepan borang e-mel dan
   kata laluan yang dia memang tidak ada. Kini pautan biasa sentiasa membuka
   skrin kod kelas, dan cikgu yang menanda buku pautan ?cikgu kekal di
   zonnya. */
function tandaZonUrl(cikgu){
  try{
    var u=new URL(location.href);
    if(cikgu===u.searchParams.has("cikgu")) return;
    if(cikgu) u.searchParams.set("cikgu","1"); else u.searchParams.delete("cikgu");
    history.replaceState(null,"",u.pathname+u.search+u.hash);

}

/* Tatal jalur mendatar supaya item aktif kelihatan. scrollIntoView tidak
   digunakan kerana ia turut menatal halaman secara menegak, dan pada skrin
   peta itu melontarkan murid ke tengah-tengah laluan. */
function tatalKeAktif(jalur,pilih){
  if(!jalur) return;
  var a=jalur.querySelector(pilih); if(!a) return;
  var lj=jalur.getBoundingClientRect(), la=a.getBoundingClientRect();
  if(la.left>=lj.left-1&&la.right<=lj.right+1) return;
  jalur.scrollLeft+=(la.left-lj.left)-(lj.width-la.width)/2;
}

/* Bungkus jalur menatal dengan penunjuk tepi, dan tatal item aktif supaya
   kelihatan. Tanpa ini, jalur bab memuatkan 768px kandungan dalam 328px
   tanpa sebarang tanda ada bab lain di sebelah kanan. */
function bungkusJalur(jalur,pilih){
  var w=el("div","jalurbungkus");
  var ki=el("span","anak kiri","‹"); ki.setAttribute("aria-hidden","true");
  var ka=el("span","anak kanan","›"); ka.setAttribute("aria-hidden","true");
  w.appendChild(ki); w.appendChild(jalur); w.appendChild(ka);
  function kemas(){
    var baki=jalur.scrollWidth-jalur.clientWidth;
    w.setAttribute("data-kiri",jalur.scrollLeft>4?"1":"0");
    w.setAttribute("data-kanan",jalur.scrollLeft<baki-4?"1":"0");
  }
  jalur.addEventListener("scroll",kemas,{passive:true});
  setTimeout(function(){ tatalKeAktif(jalur,pilih); kemas(); },0);
  return w;
}

/* Pautan peribadi: buka kelas, semak PIN di pelayan, kemudian terus ke peta.
   Jika PIN sudah ditukar cikgu, murid dibawa ke skrin PIN namanya sendiri. */
function masukPautanPeribadi(kod,no,pin){
  if(KM&&KM.kod===kod&&S.no===no&&S.kod===pin) return;
  S.latihan=false; S.kodDraf=kod; S.skrin="kodkelas";
  var buka=(KM&&KM.kod===kod)?Promise.resolve(true):bukaKelas(kod);
  buka.then(function(ok){
    if(!ok){ S.mesej="Kod kelas dalam pautan itu tidak dijumpai. Semak dengan cikgu."; render(); return; }
    S.kodDraf="";
    if(!(NAMA[KM.id]||{})[no]){ S.no=null; S.kod=""; S.skrin="nama"; render(); return; }
    return rpc("jm_masuk",{p_kelas:KM.id,p_no:no,p_pin:pin}).then(function(sah){
      if(!sah){ S.no=null; S.kod=""; S.noPilih=no; S.pinDraf=""; S.skrin="pin"; render(); return; }
      S.kod=pin; S.pinDraf="";
      masukMurid(no);
      muatBabJauh();
    });
  }).catch(function(){
    S.mesej="Tidak dapat menghubungi pelayan. Semak internet dan cuba lagi."; render();
  });
}

var GESA_PASANG=null;
window.addEventListener("beforeinstallprompt",function(e){
